<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>車輛技術與工單管理系統</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; background: #121212; }
    
    /* 統一頂部黑底導覽列，風格契合 CANN / 深色儀表板 */
    header.portal-nav {
      height: 50px;
      background: #1a1e24;
      border-bottom: 1px solid #2e3846;
      display: flex;
      align-items: center;
      padding: 0 1.5rem;
      gap: 1.5rem;
      flex-shrink: 0;
    }
    .brand-title { color: #00d2be; font-weight: bold; font-size: 1.1rem; letter-spacing: 0.5px; }
    .tab-group { display: flex; gap: 0.5rem; }
    .tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: #94a3b8;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn:hover { color: #f8fafc; background: rgba(255,255,255,0.05); }
    .tab-btn.active { background: #2563eb; color: #fff; font-weight: 500; }
    
    /* 視窗渲染容器 */
    .viewport-container { flex: 1; position: relative; width: 100%; height: calc(100vh - 50px); }
    .frame-view {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
      display: none;
    }
    .frame-view.active { display: block; }
  </style>
</head>
<body>

  <header class="portal-nav">
    <div class="brand-title">⚙️ WORKSHOP PORTAL</div>
    <div class="tab-group">
      <button class="tab-btn active" onclick="switchTab('pc')">套餐試算與 TSB (PC)</button>
      <button class="tab-btn" onclick="switchTab('table')">零件分解與熱點 (TABLE)</button>
    </div>
  </header>

  <main class="viewport-container">
    <iframe id="iframe-pc" class="frame-view active" src="https://xdespair0217.github.io/PC/index01.html"></iframe>
    <iframe id="iframe-table" class="frame-view" src="https://xdespair0217.github.io/table/"></iframe>
  </main>

  <script>
    function switchTab(view) {
      const pcFrame = document.getElementById('iframe-pc');
      const tableFrame = document.getElementById('iframe-table');
      const btns = document.querySelectorAll('.tab-btn');

      if (view === 'pc') {
        pcFrame.classList.add('active');
        tableFrame.classList.remove('active');
        btns[0].classList.add('active');
        btns[1].classList.remove('active');
        history.replaceState(null, '', '#pc');
      } else {
        tableFrame.classList.add('active');
        pcFrame.classList.remove('active');
        btns[1].classList.add('active');
        btns[0].classList.remove('active');
        history.replaceState(null, '', '#table');
      }
    }

    // 支援直接透過 URL hash 進入特定頁面
    window.addEventListener('DOMContentLoaded', () => {
      if (window.location.hash === '#table') {
        switchTab('table');
      }
    });
  </script>
</body>
</html>
