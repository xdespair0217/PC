<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>專業保養看板與技術文獻 (行動版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-color: #0d1117; 
            color: #c9d1d9; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            -webkit-tap-highlight-color: transparent; 
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #30363d; border-radius: 2px; }
        .active-doc { border-color: #dc2626 !important; background-color: #1c1917 !important; border-left: 4px solid #ef4444 !important; }
    </style>
</head>
<body class="flex flex-col min-h-screen bg-[#0d1117] pb-12 select-none">

    <!-- 手機頂部固定導覽區 -->
    <header class="sticky top-0 z-30 bg-[#161b22]/95 backdrop-blur-md border-b border-gray-800 px-3 pt-2.5 pb-2 shadow-lg">
        
        <!-- 第一列：品牌切換與主模式開關 -->
        <div class="flex items-center justify-between gap-2">
            <div class="flex items-center space-x-2">
                <div id="brand-logo" class="w-8 h-8 bg-[#2a1b08] border border-[#f59e0b] rounded-full flex items-center justify-center font-black text-white text-[9px] tracking-wider shadow shrink-0">CANN</div>
                <div class="flex items-center bg-[#0d1117] border border-gray-700 rounded-lg px-2 py-1">
                    <select id="brand-select" onchange="updateModelOptions()" class="bg-transparent text-white text-xs font-bold focus:outline-none pr-1">
                        <option value="">載入中...</option>
                    </select>
                    <span class="text-gray-600 text-xs">/</span>
                    <select id="car-model-select" onchange="executeModelSwitch(this.value)" class="bg-transparent text-white text-xs font-bold focus:outline-none pl-1 max-w-[130px] truncate">
                    </select>
                </div>
            </div>

            <div class="flex bg-[#0d1117] p-0.5 rounded-lg border border-gray-700 shrink-0">
                <button id="btn-mode-package" onclick="switchMainMode('package')" class="px-2.5 py-1 rounded text-xs font-bold bg-[#161b22] text-white shadow">
                    🛠️ 套餐
                </button>
                <button id="btn-mode-docs" onclick="switchMainMode('docs')" class="px-2.5 py-1 rounded text-xs font-bold text-gray-400">
                    📚 文獻
                </button>
            </div>
        </div>

        <!-- 第二列：水平滑動分頁標籤（保養套餐專用） -->
        <div id="package-tabs-scroll" class="flex gap-1.5 overflow-x-auto no-scrollbar pt-2 pb-1 items-center">
            <span class="text-xs text-gray-500">同步雲端分頁中...</span>
        </div>

        <!-- 第三列：頂部金額看板（含折讓計算） -->
        <div id="top-price-banner" class="mt-1 bg-[#0d1117] border border-gray-800 rounded-lg px-3 py-1.5 flex items-center justify-between shadow-inner">
            <div class="flex flex-col">
                <div class="flex items-center space-x-2 text-[10px] text-gray-400 font-mono">
                    <span>工資: <b id="labor-subtotal" class="text-gray-200 font-normal">$ 0</b></span>
                    <span class="text-gray-600">|</span>
                    <span>零件: <b id="parts-subtotal" class="text-amber-500 font-normal">$ 0</b></span>
                </div>
                <div class="flex items-baseline space-x-1.5 mt-0.5">
                    <span class="text-[11px] text-gray-400 font-medium">總計應付</span>
                    <span id="package-total" class="text-lg font-black text-green-400 font-mono tracking-tight">$ 0</span>
                    <span id="discount-badge-label" class="text-[9px] text-amber-500 font-mono hidden">(已折)</span>
                </div>
            </div>

            <div class="flex items-center space-x-1.5 bg-[#161b22] border border-gray-700 rounded-md px-2 py-1">
                <span class="text-[10px] text-gray-400 font-bold">折讓</span>
                <input type="number" id="part-discount-input" value="100" min="0" max="100" step="5" oninput="calculateTotalsWithDiscount()" class="w-8 bg-transparent text-center text-white text-xs font-bold focus:outline-none border-b border-[#f59e0b] font-mono">
                <span class="text-[10px] text-gray-400">%</span>
            </div>
        </div>

        <!-- 第四列：工項明細 / 零件圖解 切換開關 -->
        <div id="sub-mode-switch" class="mt-2 flex bg-[#0d1117] p-0.5 rounded-lg border border-gray-800">
            <button id="btn-sub-list" onclick="switchSubView('list')" class="flex-1 py-1 text-xs font-bold rounded-md bg-[#161b22] text-amber-400 shadow transition-all flex items-center justify-center space-x-1">
                <span>📋</span><span>工項明細清單</span>
            </button>
            <button id="btn-sub-grid" onclick="switchSubView('grid')" class="flex-1 py-1 text-xs font-bold rounded-md text-gray-400 hover:text-white transition-all flex items-center justify-center space-x-1">
                <span>🔧</span><span>零件圖解清單</span>
                <span id="sub-grid-badge" class="ml-1 text-[10px] bg-gray-800 px-1.5 py-0.2 rounded-full text-gray-300">0</span>
            </button>
        </div>
    </header>

    <!-- 主體內容區 -->
    <main class="flex-1 p-3 space-y-3">
        
        <!-- 視圖一：保養套餐區塊 -->
        <section id="package-view" class="flex flex-col space-y-3">
            <div class="flex items-center justify-between px-1">
                <h2 id="current-package-title" class="text-sm font-bold text-gray-100 flex items-center truncate">
                    <span class="w-2 h-3.5 bg-[#f59e0b] inline-block mr-1.5 rounded-sm shrink-0"></span>載入中...
                </h2>
                <button onclick="reloadAllData(true)" class="text-[11px] bg-[#161b22] border border-gray-700 hover:border-amber-500 text-gray-300 px-2 py-0.5 rounded-md flex items-center space-x-1 shrink-0">
                    <span>🔄</span><span>強制更新</span>
                </button>
            </div>

            <!-- 子視圖 A：項目明細清單 (卡片結構) -->
            <div id="sub-view-list" class="space-y-2.5"></div>

            <!-- 子視圖 B：零件圖解雙欄網格 -->
            <div id="sub-view-grid" class="hidden grid grid-cols-2 gap-2.5"></div>

            <!-- 現場維護提醒卡片 -->
            <div id="mobile-panel-tip" class="bg-[#161b22] rounded-xl border border-gray-800 p-3 flex flex-col justify-center shadow-lg transition-all">
                <h4 class="text-xs font-bold text-amber-400 mb-1 flex items-center gap-1">
                    <span>💡</span> 現場維護注意事項
                </h4>
                <p class="text-[11px] text-gray-300 leading-relaxed">
                    請依照原廠手冊標準程序施工。完成機油更換與周邊保養後，務必透過中控儀表或原廠診斷電腦進行油位校正及保養週期歸零重設。
                </p>
            </div>
        </section>

        <!-- 視圖二：技術文獻資料庫 -->
        <section id="docs-view" class="hidden flex flex-col space-y-3">
            <div class="flex items-center justify-between px-1">
                <div class="flex items-center space-x-1.5">
                    <span class="w-2 h-3.5 bg-red-600 inline-block rounded-sm"></span>
                    <h2 class="text-sm font-bold text-gray-100">原廠技術手冊 (TSB)</h2>
                </div>
                <div class="flex items-center space-x-1.5">
                    <span id="docs-count-badge" class="text-[10px] bg-gray-800 text-gray-300 border border-gray-700 px-2 py-0.5 rounded-full font-mono font-bold">0 份</span>
                    <button onclick="openTagCloudModal()" class="px-2 py-0.5 bg-[#161b22] border border-gray-700 text-amber-400 rounded text-[10px] font-bold flex items-center space-x-0.5">
                        <span>🏷️</span><span>標籤庫</span>
                    </button>
                </div>
            </div>

            <div class="relative">
                <input type="text" id="doc-search-input" oninput="filterDocs()" placeholder="🔍 搜尋手冊、分類或料號..." class="w-full bg-[#161b22] border border-gray-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-red-500 font-sans placeholder-gray-500 shadow-inner">
            </div>

            <!-- 水平捲動標籤列 -->
            <div id="doc-tags-container" class="flex gap-1.5 overflow-x-auto no-scrollbar py-1"></div>

            <!-- 文獻卡片容器 -->
            <div id="docs-list-container" class="space-y-2">
                <div class="text-center py-10 text-gray-500 text-xs">正在載入文獻...</div>
            </div>
        </section>

    </main>

    <!-- 剪貼簿複製提示 -->
    <div id="copy-toast" class="fixed top-24 left-1/2 -translate-x-1/2 z-50 bg-[#161b22] border border-amber-500 text-white px-4 py-2 rounded-full shadow-2xl text-xs font-semibold flex items-center space-x-2 transition-all duration-300 opacity-0 pointer-events-none">
        <span class="text-amber-400 text-sm">📋</span>
        <span id="copy-toast-msg">已複製項目明細！</span>
    </div>

    <!-- 標籤雲彈出視窗 (Modal) -->
    <div id="tag-cloud-modal" onclick="closeTagCloudModal()" class="hidden fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4 transition-opacity duration-200 opacity-0">
        <div class="bg-[#161b22] border border-gray-700 w-full max-w-sm rounded-xl p-4 shadow-2xl flex flex-col max-h-[80vh]" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center pb-2 border-b border-gray-800">
                <div class="flex items-center space-x-1.5">
                    <span>🏷️</span>
                    <h3 class="text-xs font-bold text-white">技術標籤庫 (Tag Cloud)</h3>
                </div>
                <button onclick="closeTagCloudModal()" class="text-gray-400 hover:text-white text-lg font-bold px-1">&times;</button>
            </div>
            
            <div class="my-2.5">
                <input type="text" id="modal-tag-search" oninput="filterModalTags()" placeholder="過濾標籤名稱..." class="w-full bg-[#0d1117] border border-gray-700 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-red-500 font-sans placeholder-gray-500">
            </div>

            <div id="modal-tag-grid" class="flex-1 overflow-y-auto custom-scrollbar flex flex-wrap gap-1.5 p-1 content-start max-h-[50vh]"></div>

            <div class="pt-2.5 mt-2 border-t border-gray-800 flex justify-between items-center text-[10px] text-gray-500">
                <span id="modal-tag-stats">共計 0 個分類標籤</span>
                <span>點擊自動篩選文獻</span>
            </div>
        </div>
    </div>

    <!-- 零件大圖燈箱 -->
    <div id="lightbox" onclick="closeLightbox()" class="hidden fixed inset-0 bg-black/95 z-50 flex flex-col justify-center items-center p-4 cursor-pointer transition-opacity duration-200 opacity-0">
        <div class="w-full max-h-[60vh] flex items-center justify-center p-2" onclick="event.stopPropagation()">
            <img id="lightbox-img" src="" alt="零件大圖" class="max-w-full max-h-[55vh] object-contain rounded-lg shadow-2xl">
        </div>
        <div class="mt-2 text-center w-full px-4" onclick="event.stopPropagation()">
            <p id="lightbox-part-id" class="text-xs text-amber-500 font-mono tracking-widest"></p>
            <h3 id="lightbox-title" class="text-sm font-bold text-white mt-0.5"></h3>
            <div id="lightbox-desc-container" class="mt-2 p-2.5 bg-amber-950/50 border border-amber-900/60 rounded text-amber-300 text-xs hidden text-left leading-relaxed">
                <span class="font-bold text-[10px] text-amber-400 block mb-0.5 uppercase tracking-wider">⚠️ 維護技術備註 NOTE</span>
                <span id="lightbox-desc-text"></span>
            </div>
            <button onclick="closeLightbox()" class="mt-4 px-6 py-1.5 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-full text-xs font-bold border border-gray-700 shadow">關閉預覽</button>
        </div>
    </div>

    <script>
        // 沿用桌機版 Apps Script 部署 URL
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwgRYKEiCoyWeQkyhmmnZ1rd7ydb7FDqhBEQflBmb_4kGnI-QJ1oLqpGs6mblXBIx1q4w/exec";

        // 品牌主題映射表
        const BRAND_THEMES = {
            "JEEP": {
                border: "#16a34a",
                activeTab: "bg-green-600 border-green-500",
                cardBg: "#0e2416",
                cardBorder: "#16a34a",
                tipBg: "#07150c",
                tipBorder: "#16a34a"
            },
            "PEUGEOT": {
                border: "#0284c7",
                activeTab: "bg-sky-600 border-sky-500",
                cardBg: "#0a1c33",
                cardBorder: "#0284c7",
                tipBg: "#04101e",
                tipBorder: "#0284c7"
            },
            "ALFA ROMEO": {
                border: "#dc2626",
                activeTab: "bg-red-700 border-red-600",
                cardBg: "#28080f",
                cardBorder: "#991b1b",
                tipBg: "#170408",
                tipBorder: "#991b1b"
            },
            "CITROËN": {
                border: "#ec4899",
                activeTab: "bg-pink-600 border-pink-500",
                cardBg: "#2c0b20",
                cardBorder: "#ec4899",
                tipBg: "#1a0613",
                tipBorder: "#ec4899"
            },
            "PROJECT": {
                border: "#f59e0b",
                activeTab: "bg-amber-600 border-amber-500",
                cardBg: "#291907",
                cardBorder: "#d97706",
                tipBg: "#170e03",
                tipBorder: "#d97706"
            }
        };

        const CACHE_SHEET_DATA = new Map();
        let CACHE_MODELS_DATA = null;
        let CACHE_DOCS_DATA = null;

        let dynamicModelsData = [];
        let allParsedPackages = {};
        let currentPackageKey = "";
        let selectedModelObj = null;
        let rawLaborSum = 0;
        let rawPartsSum = 0;
        let currentSubView = "list";

        let rawDocsData = [];
        let sortedTagsList = [];
        let activeDocTag = "ALL";

        function parseCSVLineRobust(str) {
            const arr = [];
            let quote = false;
            let col = '';
            for (let c = 0; c < str.length; c++) {
                let cc = str[c], nc = str[c+1];
                if (cc === '"') {
                    if (quote && nc === '"') { col += '"'; c++; }
                    else { quote = !quote; }
                } else if (cc === ',' && !quote) {
                    arr.push(col); col = '';
                } else {
                    col += cc;
                }
            }
            arr.push(col);
            return arr.map(item => item.trim());
        }

        async function initializeDynamicSheets(force = false) {
            try {
                if (!force && CACHE_MODELS_DATA) {
                    dynamicModelsData = CACHE_MODELS_DATA;
                } else {
                    const res = await fetch(GAS_API_URL + (force ? "?t=" + Date.now() : ""));
                    if (!res.ok) throw new Error("API 回應失敗");
                    dynamicModelsData = await res.json();
                    CACHE_MODELS_DATA = dynamicModelsData;
                }
                
                renderBrandSelect();
                loadTechnicalDocs(force);
            } catch (error) {
                console.error("載入失敗:", error);
                document.getElementById('current-package-title').innerText = "❌ 雲端連接失敗";
            }
        }

        function reloadAllData(force = false) {
            if (force) {
                CACHE_SHEET_DATA.clear();
                CACHE_MODELS_DATA = null;
                CACHE_DOCS_DATA = null;
            }
            initializeDynamicSheets(force);
        }

        function renderBrandSelect() {
            const brandSelect = document.getElementById('brand-select');
            const availableBrands = [...new Set(dynamicModelsData.map(item => item.brand))];
            brandSelect.innerHTML = availableBrands.map(brand => `<option value="${brand}">${brand}</option>`).join('');

            if (availableBrands.includes("PROJECT")) {
                brandSelect.value = "PROJECT";
            }
            updateModelOptions(true);
        }

        function updateModelOptions(isInitial = false) {
            const brandSelect = document.getElementById('brand-select');
            const modelSelect = document.getElementById('car-model-select');
            const currentBrand = brandSelect.value;

            const matchedModels = dynamicModelsData.filter(item => item.brand === currentBrand);
            modelSelect.innerHTML = matchedModels.map(item => `<option value="${item.sheetName}">${item.model}</option>`).join('');

            if (matchedModels.length > 0) {
                let defaultTarget = matchedModels[0].sheetName;
                if (isInitial && currentBrand === "PROJECT") {
                    const foundPrj = matchedModels.find(item => item.sheetName.includes("通用專案") || item.model.includes("通用專案"));
                    if (foundPrj) defaultTarget = foundPrj.sheetName;
                }
                modelSelect.value = defaultTarget;
                executeModelSwitch(defaultTarget);
            }
        }

        function executeModelSwitch(sheetName) {
            selectedModelObj = dynamicModelsData.find(item => item.sheetName === sheetName);
            if (!selectedModelObj) return;

            const brandLogo = document.getElementById('brand-logo');
            const brand = selectedModelObj.brand;
            const theme = BRAND_THEMES[brand] || BRAND_THEMES["PROJECT"];

            if (brand === "CITROËN") {
                brandLogo.innerText = "CITR";
                brandLogo.className = "w-8 h-8 bg-[#1a0613] border border-[#ec4899] rounded-full flex items-center justify-center font-black text-white text-[9px] tracking-wider shadow shrink-0";
            } else if (brand === "PROJECT") {
                brandLogo.innerText = "CANN";
                brandLogo.className = "w-8 h-8 bg-[#2a1b08] border border-[#f59e0b] rounded-full flex items-center justify-center font-black text-white text-[9px] tracking-wider shadow shrink-0";
            } else if (brand === "ALFA ROMEO") {
                brandLogo.innerText = "ALFA";
                brandLogo.className = "w-8 h-8 bg-[#200508] border border-[#991b1b] rounded-full flex items-center justify-center font-black text-white text-[9px] tracking-wider shadow shrink-0";
            } else if (brand === "JEEP") {
                brandLogo.innerText = "JEEP";
                brandLogo.className = "w-8 h-8 bg-[#07150c] border border-[#16a34a] rounded-full flex items-center justify-center font-black text-white text-[9px] tracking-wider shadow shrink-0";
            } else {
                brandLogo.innerText = "PEUG";
                brandLogo.className = "w-8 h-8 bg-[#04101e] border border-[#0284c7] rounded-full flex items-center justify-center font-black text-white text-[9px] tracking-wider shadow shrink-0";
            }

            // 更新提示卡片邊框色
            const tipEl = document.getElementById('mobile-panel-tip');
            if (tipEl) {
                tipEl.style.backgroundColor = theme.tipBg;
                tipEl.style.borderColor = theme.tipBorder;
            }

            fetchSheetData();
        }

        async function fetchSheetData() {
            if (!selectedModelObj) return;
            const sheetName = selectedModelObj.sheetName;

            if (CACHE_SHEET_DATA.has(sheetName)) {
                parseExcelCSV(CACHE_SHEET_DATA.get(sheetName));
                return;
            }

            document.getElementById('package-tabs-scroll').innerHTML = '<span class="text-xs text-gray-500">⚡ 載入中...</span>';

            try {
                const targetUrl = `${GAS_API_URL}?action=getSheetCsv&sheet=${encodeURIComponent(sheetName)}&t=${Date.now()}`;
                const response = await fetch(targetUrl);
                const csvText = await response.text();
                
                CACHE_SHEET_DATA.set(sheetName, csvText);
                parseExcelCSV(csvText);
            } catch (error) {
                console.error("載入失敗:", error);
                document.getElementById('current-package-title').innerText = "❌ 資料載入失敗";
            }
        }

        function parseExcelCSV(csvText) {
            const lines = csvText.split(/\r?\n/);
            const packages = {};
            let currentPackageName = ""; 

            lines.forEach((line) => {
                const cols = parseCSVLineRobust(line);
                if (cols.length < 3) return;

                const foundPackageCell = cols.find(cell => cell && (cell.includes("套餐") || cell.includes("專案")));
                
                if (foundPackageCell) {
                    currentPackageName = foundPackageCell;
                    packages[currentPackageName] = { name: currentPackageName, pdfUrl: "", items: [] };
                    const rawLCol = cols[11] || "";
                    if (rawLCol.startsWith("http")) packages[currentPackageName].pdfUrl = rawLCol;
                    return;
                }

                if (currentPackageName) {
                    const rawLCol = cols[11] || "";
                    if (rawLCol.startsWith("http") && !packages[currentPackageName].pdfUrl) {
                        packages[currentPackageName].pdfUrl = rawLCol;
                    }
                }

                const attr = cols[0] || "";
                const partId = cols[1] || "";
                const name = cols[2] || "";

                if (currentPackageName && partId && partId !== "料號" && attr !== "屬性") {
                    packages[currentPackageName].items.push({
                        attr,
                        partId,
                        name,
                        price: cols[3] || "0",
                        qty: cols[4] || "1",
                        discount: cols[5] || "1",
                        subtotal: cols[6] || "0",
                        location: cols[7] || "", 
                        stock: cols[8] || "", 
                        description: cols[9] || ""
                    });
                }
            });

            allParsedPackages = packages;
            const keys = Object.keys(allParsedPackages);
            if (keys.length > 0) {
                renderTabs(keys);
                switchPackage(keys[0]);
            } else {
                document.getElementById('current-package-title').innerText = "⚠️ 查無套餐項目";
                document.getElementById('sub-view-list').innerHTML = '';
                document.getElementById('sub-view-grid').innerHTML = '';
            }
        }

        function renderTabs(keys) {
            const tabsContainer = document.getElementById('package-tabs-scroll');
            tabsContainer.innerHTML = keys.map(key => `
                <button onclick="switchPackage('${key}')" id="tab-${key}" class="px-3 py-1 rounded-full text-xs font-bold transition-all bg-[#161b22] text-gray-400 border border-gray-800 whitespace-nowrap shrink-0">
                    ${key}
                </button>
            `).join('');
        }

        function switchPackage(key) {
            if (!allParsedPackages[key]) return;

            const brand = selectedModelObj ? selectedModelObj.brand : "PROJECT";
            const theme = BRAND_THEMES[brand] || BRAND_THEMES["PROJECT"];

            if (currentPackageKey) {
                const prevTab = document.getElementById(`tab-${currentPackageKey}`);
                if (prevTab) prevTab.className = "px-3 py-1 rounded-full text-xs font-bold transition-all bg-[#161b22] text-gray-400 border border-gray-800 whitespace-nowrap shrink-0";
            }
            
            const activeTab = document.getElementById(`tab-${key}`);
            if (activeTab) {
                activeTab.className = `px-3 py-1 rounded-full text-xs font-bold transition-all text-white border whitespace-nowrap shrink-0 shadow-lg ${theme.activeTab}`;
                activeTab.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }

            currentPackageKey = key;
            const pkg = allParsedPackages[key];
            
            let titleHTML = `<span class="w-2 h-3.5 inline-block mr-1.5 rounded-sm shrink-0" style="background-color: ${theme.border};"></span>${pkg.name}`;
            if (pkg.pdfUrl) {
                titleHTML += `
                    <a href="${pkg.pdfUrl}" target="_blank" class="ml-2 inline-flex items-center gap-1 px-2 py-0.5 text-[11px] font-medium text-amber-300 bg-amber-950/80 border border-amber-800 rounded-md">
                        <span>📄</span><span>技術PDF</span>
                    </a>
                `;
            }
            document.getElementById('current-package-title').innerHTML = titleHTML;

            let listHTML = '';
            let gridHTML = '';
            let partCount = 0;
            rawLaborSum = 0;
            rawPartsSum = 0;

            pkg.items.forEach(item => {
                const isLabor = item.attr === "工資";
                const displayPrice = parseFloat(item.price) || 0;
                const displayQty = parseFloat(item.qty) || 1;
                const displayDiscount = parseFloat(item.discount) || 1;
                const lineSubtotal = Math.round(displayPrice * displayQty * displayDiscount);

                if (isLabor) {
                    rawLaborSum += lineSubtotal;
                } else {
                    rawPartsSum += lineSubtotal;
                    partCount++;
                }

                let stockBadge = '';
                if (!isLabor && item.stock !== "") {
                    const num = parseFloat(item.stock);
                    if (isNaN(num) || num <= 0) {
                        stockBadge = '<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-rose-950 text-rose-400 border border-rose-900 animate-pulse">缺料(0)</span>';
                    } else if (num <= 2) {
                        stockBadge = `<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-amber-950 text-amber-400 border border-amber-900">${num}(告急)</span>`;
                    } else {
                        stockBadge = `<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-emerald-950 text-emerald-400 border border-emerald-900">存:${num}</span>`;
                    }
                }

                const imgUrlPng = `${item.partId}.png`;
                const imgUrlJpg = `${item.partId}.jpg`;
                const defaultImg = "https://images.unsplash.com/photo-1530046339160-ce3e530c7d2f?auto=format&fit=crop&w=300&q=80";
                const safeDesc = encodeURIComponent(item.description || "");

                const rowInfoData = encodeURIComponent(JSON.stringify({
                    attr: item.attr,
                    partId: item.partId,
                    name: item.name,
                    price: displayPrice,
                    qty: displayQty,
                    subtotal: lineSubtotal,
                    location: item.location || '',
                    stock: item.stock !== "" ? item.stock : ''
                }));

                // 清單視圖 (List View)
                listHTML += `
                    <div class="bg-[#161b22] border border-gray-800 rounded-xl p-3 shadow-md flex flex-col space-y-2 relative">
                        <div class="flex items-start justify-between gap-2">
                            <div class="flex items-center space-x-1.5">
                                <span class="px-1.5 py-0.5 rounded text-[10px] font-bold ${isLabor ? 'bg-slate-800 text-slate-300' : 'bg-amber-950/70 text-amber-400 border border-amber-900/60'}">${item.attr}</span>
                                <span onclick="copyRowInfo(event, '${rowInfoData}')" class="font-mono text-xs font-bold text-gray-200 bg-[#0d1117] border border-gray-700 px-2 py-0.5 rounded flex items-center gap-1 active:scale-95 transition-transform" title="點擊複製明細">
                                    ${item.partId}
                                    <span class="text-[10px] text-amber-500">📋</span>
                                </span>
                            </div>
                            <div class="flex items-center space-x-1">
                                ${stockBadge}
                                ${item.location ? `<span class="text-[10px] font-mono text-amber-500 font-semibold bg-[#0d1117] px-1.5 py-0.5 rounded border border-gray-800">${item.location}</span>` : ''}
                            </div>
                        </div>

                        <div class="flex gap-2.5 items-center">
                            ${!isLabor ? `
                                <div class="w-12 h-12 bg-[#0d1117] rounded-lg border border-gray-800 flex items-center justify-center shrink-0 overflow-hidden" onclick="openLightbox('${imgUrlPng}', '${item.partId}', '${item.name}', '${defaultImg}', '${safeDesc}')">
                                    <img src="${imgUrlPng}" alt="" loading="lazy" onerror="if(this.src.endsWith('.png')){this.src='${imgUrlJpg}';}else{this.src='${defaultImg}';}" class="w-full h-full object-contain p-1">
                                </div>
                            ` : ''}
                            <div class="flex-1 min-w-0">
                                <h3 class="text-xs font-semibold text-white leading-snug break-words">${item.name}</h3>
                                <div class="flex items-center justify-between mt-1 text-[11px] text-gray-400 font-mono">
                                    <span>$${displayPrice.toLocaleString()} × ${displayQty}</span>
                                    <span class="text-xs font-bold text-green-400">$ ${lineSubtotal.toLocaleString()}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                // 網格視圖 (Grid View) - 帶入品牌專屬色彩
                if (!isLabor && item.partId) {
                    gridHTML += `
                        <div style="background-color: ${theme.cardBg}; border: 1px solid ${theme.cardBorder};" class="rounded-xl p-2.5 flex flex-col justify-between shadow active:scale-[0.98] transition-transform cursor-pointer" onclick="openLightbox('${imgUrlPng}', '${item.partId}', '${item.name}', '${defaultImg}', '${safeDesc}')">
                            <div class="w-full h-28 bg-[#0d1117] rounded-lg flex items-center justify-center overflow-hidden relative">
                                <img src="${imgUrlPng}" alt="" loading="lazy" onerror="if(this.src.endsWith('.png')){this.src='${imgUrlJpg}';}else{this.src='${defaultImg}';}" class="w-full h-full object-contain p-1.5">
                                <div class="absolute bottom-1 right-1 bg-black/60 px-1 py-0.5 rounded text-[9px] text-amber-400">🔍 看大圖</div>
                            </div>
                            <div class="mt-2 text-center">
                                <p class="text-[10px] text-amber-500/90 font-mono">${item.partId}</p>
                                <h4 class="text-xs text-white font-medium truncate mt-0.5">${item.name}</h4>
                            </div>
                        </div>
                    `;
                }
            });

            document.getElementById('sub-view-list').innerHTML = listHTML;
            document.getElementById('sub-view-grid').innerHTML = gridHTML || '<div class="col-span-2 text-center py-12 text-gray-500 text-xs">此套餐無實體零件圖解</div>';
            document.getElementById('sub-grid-badge').innerText = partCount;
            calculateTotalsWithDiscount();
        }

        function switchSubView(view) {
            currentSubView = view;
            const btnList = document.getElementById('btn-sub-list');
            const btnGrid = document.getElementById('btn-sub-grid');
            const viewList = document.getElementById('sub-view-list');
            const viewGrid = document.getElementById('sub-view-grid');

            if (view === 'grid') {
                viewList.classList.add('hidden');
                viewGrid.classList.remove('hidden');
                btnList.className = "flex-1 py-1 text-xs font-bold rounded-md text-gray-400 hover:text-white transition-all flex items-center justify-center space-x-1";
                btnGrid.className = "flex-1 py-1 text-xs font-bold rounded-md bg-[#161b22] text-amber-400 shadow transition-all flex items-center justify-center space-x-1";
            } else {
                viewGrid.classList.add('hidden');
                viewList.classList.remove('hidden');
                btnGrid.className = "flex-1 py-1 text-xs font-bold rounded-md text-gray-400 hover:text-white transition-all flex items-center justify-center space-x-1";
                btnList.className = "flex-1 py-1 text-xs font-bold rounded-md bg-[#161b22] text-amber-400 shadow transition-all flex items-center justify-center space-x-1";
            }
        }

        function copyRowInfo(event, encodedData) {
            event.stopPropagation();
            try {
                const item = JSON.parse(decodeURIComponent(encodedData));
                const isLabor = item.attr === "工資";
                let stockDisplay = item.stock ? `${item.stock} 件` : (isLabor ? "不適用" : "0 件");
                
                const now = new Date();
                const timeStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                
                const formattedText = 
`┏━━━━━━━━━━━━━━━━━━━━┓
   ${isLabor ? '🔧' : '🛠️'} 原廠保養維護明細
┗━━━━━━━━━━━━━━━━━━━━┛
🔹【${isLabor ? '工項代碼' : '零件料號'}】${item.partId}
${isLabor ? '⏱️' : '📦'}【項目品名】${item.name} (${item.attr})
💵【標準單價】$ ${item.price.toLocaleString()}
🔢【更換數量】${item.qty} ${isLabor ? '工時/單位' : '件'}
💰【加總金額】$ ${item.subtotal.toLocaleString()}
📍【儲位層架】${item.location || '未設定 / 依現場動線'}
${isLabor ? '⚡' : '🏷️'}【即時庫存】${stockDisplay}
━━━━━━━━━━━━━━━━━━━━
⏱️ 查詢時間：${timeStr}
🏢 尚鵬內湖品牌旗艦 ‧ 專業售後服務`;

                navigator.clipboard.writeText(formattedText).then(() => {
                    showCopyToast(`已複製 [${item.partId}] 明細！`);
                }).catch(() => {
                    const textarea = document.createElement('textarea');
                    textarea.value = formattedText;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    showCopyToast(`已複製 [${item.partId}] 明細！`);
                });
            } catch (e) {}
        }

        function showCopyToast(msg) {
            const toast = document.getElementById('copy-toast');
            document.getElementById('copy-toast-msg').innerText = msg;
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 1600);
        }

        function calculateTotalsWithDiscount() {
            const discountInput = document.getElementById('part-discount-input');
            let discountRate = parseFloat(discountInput.value);
            if (isNaN(discountRate) || discountRate < 0) discountRate = 100;

            const discountedPartsSum = Math.round(rawPartsSum * (discountRate / 100));
            const grandTotal = rawLaborSum + discountedPartsSum;

            document.getElementById('labor-subtotal').innerText = `$ ${rawLaborSum.toLocaleString()}`;
            document.getElementById('parts-subtotal').innerText = `$ ${discountedPartsSum.toLocaleString()}`;
            document.getElementById('package-total').innerText = `$ ${grandTotal.toLocaleString()}`;

            const badge = document.getElementById('discount-badge-label');
            if (discountRate < 100) {
                badge.innerText = `(${discountRate}折)`;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function openLightbox(imgSrc, partId, title, defaultImg, encodedDesc) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            const lightboxPartId = document.getElementById('lightbox-part-id');
            const lightboxTitle = document.getElementById('lightbox-title');
            
            const description = decodeURIComponent(encodedDesc).trim();
            const descContainer = document.getElementById('lightbox-desc-container');
            const descText = document.getElementById('lightbox-desc-text');

            lightboxImg.src = imgSrc;
            lightboxImg.onerror = function() { this.src = defaultImg; };
            lightboxPartId.innerText = partId;
            lightboxTitle.innerText = title;

            if (description) {
                descText.innerText = description;
                descContainer.classList.remove('hidden');
            } else {
                descContainer.classList.add('hidden');
            }

            lightbox.classList.remove('hidden');
            setTimeout(() => { lightbox.classList.remove('opacity-0'); }, 10);
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.add('opacity-0');
            setTimeout(() => { lightbox.classList.add('hidden'); }, 200);
        }

        /* -------------------------------------------------------------
            技術文獻系統 (對接 GAS action=getDocs)
        ------------------------------------------------------------- */
        function switchMainMode(mode) {
            const packageView = document.getElementById('package-view');
            const docsView = document.getElementById('docs-view');
            const btnPackage = document.getElementById('btn-mode-package');
            const btnDocs = document.getElementById('btn-mode-docs');
            const pkgTabs = document.getElementById('package-tabs-scroll');
            const topPriceBanner = document.getElementById('top-price-banner');
            const subModeSwitch = document.getElementById('sub-mode-switch');

            if (mode === 'docs') {
                packageView.classList.add('hidden');
                docsView.classList.remove('hidden');
                topPriceBanner.classList.add('hidden');
                subModeSwitch.classList.add('hidden');
                pkgTabs.classList.add('hidden');
                btnPackage.className = "px-2.5 py-1 rounded text-xs font-bold text-gray-400";
                btnDocs.className = "px-2.5 py-1 rounded text-xs font-bold bg-red-600 text-white shadow";
                filterDocs();
            } else {
                docsView.classList.add('hidden');
                packageView.classList.remove('hidden');
                topPriceBanner.classList.remove('hidden');
                subModeSwitch.classList.remove('hidden');
                pkgTabs.classList.remove('hidden');
                btnDocs.className = "px-2.5 py-1 rounded text-xs font-bold text-gray-400";
                btnPackage.className = "px-2.5 py-1 rounded text-xs font-bold bg-[#161b22] text-white shadow";
            }
        }

        async function loadTechnicalDocs(force = false) {
            try {
                if (!force && CACHE_DOCS_DATA) {
                    rawDocsData = CACHE_DOCS_DATA;
                } else {
                    const docsUrl = `${GAS_API_URL}?action=getDocs&t=${Date.now()}`;
                    const res = await fetch(docsUrl);
                    if (!res.ok) return;
                    const parsedDocs = await res.json();

                    rawDocsData = (parsedDocs || []).sort((a, b) => {
                        const dateA = new Date(a.date || '1970-01-01').getTime();
                        const dateB = new Date(b.date || '1970-01-01').getTime();
                        return dateB - dateA;
                    });
                    CACHE_DOCS_DATA = rawDocsData;
                }

                calculateTagStatistics();
                renderDocTags();
                filterDocs();
            } catch (err) {
                console.error("載入文獻失敗:", err);
            }
        }

        function calculateTagStatistics() {
            const counts = {};
            rawDocsData.forEach(doc => {
                if (doc.category) {
                    doc.category.split(/[\/, ]/).forEach(t => {
                        const trimmed = t.trim();
                        if (trimmed) counts[trimmed] = (counts[trimmed] || 0) + 1;
                    });
                }
            });

            sortedTagsList = Object.keys(counts).map(tag => ({
                tag: tag,
                count: counts[tag]
            })).sort((a, b) => b.count - a.count);
        }

        function renderDocTags() {
            const container = document.getElementById('doc-tags-container');
            let tagsHTML = `
                <button onclick="setDocTag('ALL')" class="px-2.5 py-1 rounded-full text-xs font-bold shrink-0 ${activeDocTag === 'ALL' ? 'bg-red-600 text-white shadow' : 'bg-[#161b22] text-gray-400 border border-gray-800'}">
                    全部 (${rawDocsData.length})
                </button>
            `;

            sortedTagsList.forEach(item => {
                const isActive = activeDocTag === item.tag;
                tagsHTML += `
                    <button onclick="setDocTag('${item.tag}')" class="px-2.5 py-1 rounded-full text-xs font-bold shrink-0 ${isActive ? 'bg-red-600 text-white shadow' : 'bg-[#161b22] text-gray-400 border border-gray-800'}">
                        ${item.tag} (${item.count})
                    </button>
                `;
            });

            container.innerHTML = tagsHTML;
        }

        function setDocTag(tag) {
            activeDocTag = tag;
            renderDocTags();
            filterDocs();
            closeTagCloudModal();
        }

        function filterDocs() {
            const searchKeyword = document.getElementById('doc-search-input').value.trim().toLowerCase();

            const filtered = rawDocsData.filter(doc => {
                const matchTag = (activeDocTag === "ALL") || (doc.category && doc.category.includes(activeDocTag));
                const matchSearch = !searchKeyword || 
                    (doc.title && doc.title.toLowerCase().includes(searchKeyword)) ||
                    (doc.category && doc.category.toLowerCase().includes(searchKeyword)) ||
                    (doc.keyword && doc.keyword.toLowerCase().includes(searchKeyword)) ||
                    (doc.date && doc.date.toLowerCase().includes(searchKeyword));
                return matchTag && matchSearch;
            });

            renderDocsList(filtered);
        }

        function renderDocsList(docs) {
            const listContainer = document.getElementById('docs-list-container');
            document.getElementById('docs-count-badge').innerText = `${docs.length} 份`;

            if (docs.length === 0) {
                listContainer.innerHTML = '<div class="text-center py-10 text-gray-500 text-xs">查無符合條件的技術文獻</div>';
                return;
            }

            listContainer.innerHTML = docs.map((doc) => {
                let targetUrl = doc.url || '#';
                if (targetUrl.includes('drive.google.com') && targetUrl.includes('/view')) {
                    targetUrl = targetUrl.replace('/view', '/preview');
                }

                return `
                    <a href="${targetUrl}" target="_blank" class="block bg-[#161b22] border border-gray-800 rounded-xl p-3 shadow active:border-red-500 transition-colors">
                        <div class="flex items-center justify-between gap-2">
                            <span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-red-950/80 text-red-400 border border-red-900 truncate">
                                📑 ${doc.category || '未分類'}
                            </span>
                            <span class="text-[10px] text-gray-500 font-mono">${doc.date || ''}</span>
                        </div>
                        <h4 class="text-xs font-semibold text-white mt-1.5 leading-snug line-clamp-2">${doc.title}</h4>
                        <div class="flex justify-end items-center mt-2 text-[10px] text-red-400 font-medium">
                            <span>開啟技術手冊 PDF</span> <span class="ml-1 text-[8px]">▶</span>
                        </div>
                    </a>
                `;
            }).join('');
        }

        /* -------------------------------------------------------------
            Obsidian 標籤雲彈出視窗 (Modal) 控制
        ------------------------------------------------------------- */
        function openTagCloudModal() {
            const modal = document.getElementById('tag-cloud-modal');
            const searchInput = document.getElementById('modal-tag-search');
            searchInput.value = '';
            
            renderModalTagGrid(sortedTagsList);
            document.getElementById('modal-tag-stats').innerText = `共計 ${sortedTagsList.length} 個分類標籤`;

            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); }, 10);
            searchInput.focus();
        }

        function closeTagCloudModal() {
            const modal = document.getElementById('tag-cloud-modal');
            modal.classList.add('opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); }, 200);
        }

        function filterModalTags() {
            const query = document.getElementById('modal-tag-search').value.trim().toLowerCase();
            const filtered = sortedTagsList.filter(item => item.tag.toLowerCase().includes(query));
            renderModalTagGrid(filtered);
        }

        function renderModalTagGrid(list) {
            const grid = document.getElementById('modal-tag-grid');
            if (list.length === 0) {
                grid.innerHTML = '<div class="text-xs text-gray-500 py-4 w-full text-center">找不到匹配的標籤</div>';
                return;
            }

            let html = `
                <button onclick="setDocTag('ALL')" class="px-2.5 py-1 rounded text-xs font-bold transition-all ${activeDocTag === 'ALL' ? 'bg-red-600 text-white shadow' : 'bg-[#0d1117] text-gray-300 border border-gray-700'}">
                    # 全部 (${rawDocsData.length})
                </button>
            `;

            list.forEach(item => {
                const isActive = activeDocTag === item.tag;
                html += `
                    <button onclick="setDocTag('${item.tag}')" class="px-2.5 py-1 rounded text-xs font-bold transition-all flex items-center space-x-1 ${isActive ? 'bg-red-600 text-white shadow' : 'bg-[#0d1117] text-gray-300 border border-gray-700'}">
                        <span># ${item.tag}</span>
                        <span class="text-[9px] ${isActive ? 'text-white/80' : 'text-gray-500 font-mono'}">(${item.count})</span>
                    </button>
                `;
            });

            grid.innerHTML = html;
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeLightbox();
                closeTagCloudModal();
            }
        });

        // 啟動加載
        initializeDynamicSheets();
    </script>
</body>
</html>
