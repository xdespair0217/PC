<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專業多車型保養看板與技術文獻</title>
    <!-- Tailwind CSS 暗色風格 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #161b22; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
        .active-row { background-color: #1f242c !important; border-left: 4px solid #f59e0b !important; }
        .active-card { border-color: #f59e0b !important; background-color: #21262d !important; transform: scale(1.02); }
        .active-doc { border-color: #dc2626 !important; background-color: #1c1917 !important; border-left: 4px solid #ef4444 !important; }
    </style>
</head>
<body class="h-screen overflow-hidden flex flex-col p-4 relative">

    <!-- 頂部標頭列 -->
    <header class="flex flex-col lg:flex-row justify-between items-start lg:items-center border-b border-gray-800 pb-3 mb-3 gap-3 shrink-0">
        <div class="flex items-center space-x-3 shrink-0">
            <!-- 品牌圓標 -->
            <div id="brand-logo" class="w-10 h-10 bg-[#2a1b08] border border-[#f59e0b] rounded-full flex items-center justify-center font-black text-white text-[10px] tracking-wider shadow-md shadow-amber-900/30 transition-all">CANN</div>
            <div>
                <!-- 動態下拉選單 -->
                <div class="flex items-center space-x-2 bg-[#161b22] border border-gray-700 rounded-lg px-2.5 py-1">
                    <div class="flex items-center space-x-1">
                        <label for="brand-select" class="text-xs text-gray-400 font-bold whitespace-nowrap">品牌：</label>
                        <select id="brand-select" onchange="updateModelOptions()" class="bg-[#0d1117] text-white border border-gray-800 rounded px-1.5 py-0.5 text-xs font-bold focus:outline-none focus:border-amber-500 cursor-pointer">
                            <option value="">載入中...</option>
                        </select>
                    </div>
                    
                    <div class="h-4 border-l border-gray-700"></div>

                    <div class="flex items-center space-x-1">
                        <label for="car-model-select" class="text-xs text-gray-400 font-bold whitespace-nowrap">車系與型號：</label>
                        <select id="car-model-select" onchange="executeModelSwitch(this.value)" class="bg-[#0d1117] text-white border border-gray-800 rounded px-1.5 py-0.5 text-xs font-bold focus:outline-none focus:border-amber-500 cursor-pointer min-w-[150px]">
                        </select>
                    </div>
                </div>
            </div>

            <!-- 主功能切換鈕 -->
            <div class="flex bg-[#161b22] p-1 rounded-lg border border-gray-700">
                <button id="btn-mode-package" onclick="switchMainMode('package')" class="px-3 py-1 rounded text-xs font-bold transition-all bg-[#0d1117] text-white shadow">
                    🛠️ 保養套餐看板
                </button>
                <button id="btn-mode-docs" onclick="switchMainMode('docs')" class="px-3 py-1 rounded text-xs font-bold transition-all text-gray-400 hover:text-white">
                    📚 技術文獻資料庫
                </button>
            </div>
        </div>
        
        <!-- 套餐切換標籤列 -->
        <div id="package-tabs" class="flex flex-wrap gap-1.5 max-w-2xl justify-start lg:justify-center">
            <span class="text-xs text-gray-500">正在同步試算表分頁...</span>
        </div>

        <button onclick="reloadAllData()" class="bg-[#161b22] hover:bg-gray-800 text-gray-300 hover:text-white text-xs px-3 py-1.5 rounded-lg transition-all border border-gray-700 flex items-center space-x-1 shrink-0">
            <span>🔄</span> <span>重新整理</span>
        </button>
    </header>

    <!-- 主工作區 -->
    <main class="flex-1 flex overflow-hidden">
        
        <!-- 視圖一：保養套餐看板 (左表格 + 右零件圖) -->
        <section id="package-view" class="flex-1 flex space-x-4 overflow-hidden">
            
            <div class="w-7/12 flex flex-col bg-[#161b22] rounded-xl border border-gray-800 p-4 overflow-hidden shadow-2xl">
                <div class="flex justify-between items-center mb-2 shrink-0">
                    <h2 id="current-package-title" class="text-base font-bold text-gray-100 flex items-center">
                        <span class="w-2 h-4 bg-[#f59e0b] inline-block mr-2 rounded-sm"></span>載入中...
                    </h2>
                    <span id="status-badge" class="text-[10px] bg-green-950 text-green-400 border border-green-900 px-2 py-0.5 rounded-full font-semibold">連線正常</span>
                </div>

                <div class="flex-1 overflow-y-auto custom-scrollbar">
                    <table class="w-full text-left text-xs">
                        <thead>
                            <tr class="border-b border-gray-700 text-gray-400 bg-[#0d1117] sticky top-0 z-10">
                                <th class="p-2.5 rounded-l-md">屬性</th>
                                <th class="p-2.5">料號</th>
                                <th class="p-2.5">項目名稱</th>
                                <th class="p-2.5 text-right">單價</th>
                                <th class="p-2.5 text-right">數量</th>
                                <th class="p-2.5 text-right">打折</th>
                                <th class="p-2.5 text-right">加總</th>
                                <th class="p-2.5 text-center">層架</th>
                                <th class="p-2.5 text-center rounded-r-md">即時庫存</th>
                            </tr>
                        </thead>
                        <tbody id="table-rows">
                        </tbody>
                    </table>
                </div>

                <div class="border-t border-gray-800 pt-3 mt-2 flex justify-between items-center gap-2 text-xs text-gray-400 shrink-0">
                    <div class="flex flex-wrap space-x-4">
                        <div>工資小計：<span id="labor-subtotal" class="font-bold text-gray-200 font-mono">$ 0</span></div>
                        <div class="border-l border-gray-800 pl-4">零件原價：<span id="parts-original-total" class="font-bold text-gray-200 font-mono">$ 0</span></div>
                        <div class="border-l border-gray-800 pl-4">零件折後：<span id="parts-subtotal" class="font-bold text-amber-500 font-mono">$ 0</span></div>
                    </div>

                    <div class="flex items-center space-x-2 bg-[#0d1117] border border-gray-700 rounded-lg px-2 py-1 shrink-0">
                        <span class="text-[11px] text-gray-400 font-bold">零件折扣：</span>
                        <input 
                            type="number" 
                            id="part-discount-input" 
                            value="100" 
                            min="0" 
                            max="100" 
                            step="5"
                            oninput="calculateTotalsWithDiscount()"
                            class="w-10 bg-[#161b22] text-center text-white text-xs font-bold focus:outline-none border-b border-[#f59e0b] font-mono"
                        >
                        <span class="text-[11px] text-gray-300 font-bold">%</span>
                    </div>
                </div>

                <div class="border-t border-gray-800 pt-2 mt-2 flex justify-between items-center shrink-0">
                    <div class="flex flex-col">
                        <span class="text-gray-400 text-xs font-medium">套餐應付總金額</span>
                        <span id="discount-note" class="text-[10px] text-amber-500/80 font-medium hidden">＊已套用零件折扣</span>
                    </div>
                    <span id="package-total" class="text-2xl font-black text-green-400 font-mono tracking-tight">$ 0</span>
                </div>
            </div>

            <div class="w-5/12 flex flex-col space-y-3 overflow-hidden">
                <div class="flex-1 bg-[#161b22] rounded-xl border border-gray-800 p-4 flex flex-col overflow-hidden shadow-2xl">
                    <h3 class="text-xs font-semibold text-gray-400 mb-3 tracking-wider flex items-center shrink-0">
                        <span class="mr-1.5">🔧</span>套餐内含零件圖解
                    </h3>
                    <div id="image-grid" class="flex-1 grid grid-cols-2 gap-3 overflow-y-auto custom-scrollbar p-1 align-content-start">
                    </div>
                </div>

                <div class="h-24 bg-[#161b22] rounded-xl border border-gray-800 p-3 flex flex-col justify-center shrink-0">
                    <h4 class="text-xs font-bold text-amber-400 mb-1">💡 現場維護提示</h4>
                    <p class="text-[11px] text-gray-400 leading-relaxed">
                        請技師依照原廠技術手冊規範施工。機油添加完畢後，請透過中控儀表或原廠診斷電腦進行油位校正及保養週期歸零。
                    </p>
                </div>
            </div>

        </section>

        <!-- 視圖二：技術文獻資料庫 (水平標準分欄：左 380px + 右自適應撐滿) -->
        <section id="docs-view" class="hidden flex-1 flex flex-row space-x-4 overflow-hidden w-full h-full">
            
            <!-- 左側清單 -->
            <div class="w-[380px] shrink-0 bg-[#161b22] rounded-xl border border-gray-800 p-4 flex flex-col overflow-hidden shadow-2xl">
                <div class="flex justify-between items-center mb-3 shrink-0">
                    <h2 class="text-sm font-bold text-gray-100 flex items-center">
                        <span class="w-2 h-4 bg-red-600 inline-block mr-2 rounded-sm"></span>原廠 TSB 與技術手冊
                    </h2>
                    <span id="docs-count-badge" class="text-[10px] bg-gray-800 text-gray-300 border border-gray-700 px-2 py-0.5 rounded-full font-mono font-bold">0 份文件</span>
                </div>

                <!-- 搜尋框 -->
                <div class="relative mb-3 shrink-0">
                    <input 
                        type="text" 
                        id="doc-search-input" 
                        oninput="filterDocs()" 
                        placeholder="🔍 搜尋手冊標題、分類或料號..." 
                        class="w-full bg-[#0d1117] border border-gray-700 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-red-500 font-sans placeholder-gray-500"
                    >
                </div>

                <!-- 標籤分類鈕 -->
                <div id="doc-tags-container" class="flex flex-wrap gap-1.5 mb-3 overflow-y-auto max-h-24 custom-scrollbar shrink-0">
                </div>

                <!-- 文獻卡片列表 -->
                <div id="docs-list-container" class="flex-1 overflow-y-auto custom-scrollbar space-y-2 pr-1">
                    <div class="text-center py-8 text-gray-500 text-xs">正在載入文獻...</div>
                </div>
            </div>

            <!-- 右側 PDF 預覽 -->
            <div class="flex-1 bg-[#161b22] rounded-xl border border-gray-800 p-2 flex flex-col overflow-hidden shadow-2xl relative">
                <div id="pdf-placeholder" class="flex-1 flex flex-col items-center justify-center text-gray-500">
                    <div class="text-4xl mb-2 opacity-40">📄</div>
                    <p class="text-sm font-bold text-gray-300">請選擇左側文件進行預覽</p>
                    <p class="text-xs text-gray-500 mt-1">點擊左側卡片即可在此預覽原廠 PDF</p>
                </div>
                <iframe id="pdf-iframe" class="hidden w-full h-full rounded border-0 bg-[#0d1117]" src=""></iframe>
            </div>

        </section>

    </main>

    <!-- 零件大圖燈箱 -->
    <div id="lightbox" onclick="closeLightbox()" class="hidden fixed inset-0 bg-black/90 z-50 flex flex-col justify-center items-center p-4 cursor-zoom-out transition-opacity duration-300 opacity-0">
        <button class="absolute top-6 right-6 text-gray-400 hover:text-white text-3xl font-light focus:outline-none">&times;</button>
        <div class="max-w-4xl max-h-[80vh] flex items-center justify-center bg-[#161b22] p-2 rounded-lg border border-gray-800 shadow-2xl" onclick="event.stopPropagation()">
            <img id="lightbox-img" src="" alt="零件大圖" class="max-w-full max-h-[75vh] object-contain rounded">
        </div>
        <div class="mt-3 text-center max-w-xl" onclick="event.stopPropagation()">
            <p id="lightbox-part-id" class="text-xs text-gray-500 font-mono tracking-widest"></p>
            <h3 id="lightbox-title" class="text-base font-bold text-white mt-0.5"></h3>
            <div id="lightbox-desc-container" class="mt-2 px-3 py-1.5 bg-amber-950/40 border border-amber-900/50 rounded text-amber-400 text-xs hidden leading-relaxed">
                <span class="font-bold block text-amber-500 text-[10px] tracking-wider uppercase mb-0.5">⚠️ 現場維護說明 NOTE</span>
                <span id="lightbox-desc-text"></span>
            </div>
        </div>
    </div>

    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwgRYKEiCoyWeQkyhmmnZ1rd7ydb7FDqhBEQflBmb_4kGnI-QJ1oLqpGs6mblXBIx1q4w/exec";

        let dynamicModelsData = []; 
        let allParsedPackages = {}; 
        let currentPackageKey = "";
        let selectedModelObj = null;
        let rawLaborSum = 0;
        let rawPartsSum = 0;

        let rawDocsData = [];
        let activeDocTag = "ALL";

        async function initializeDynamicSheets() {
            const tabsContainer = document.getElementById('package-tabs');
            const statusBadge = document.getElementById('status-badge');
            
            try {
                tabsContainer.innerHTML = '<span class="text-xs text-gray-500">正在同步試算表分頁...</span>';
                
                const response = await fetch(GAS_API_URL + "?t=" + Date.now());
                if (!response.ok) throw new Error("API 回應異常: " + response.status);
                
                dynamicModelsData = await response.json();
                
                if (!Array.isArray(dynamicModelsData) || dynamicModelsData.length === 0) {
                    throw new Error("未能讀取到任何符合規則的分頁");
                }

                statusBadge.innerText = "連線正常";
                statusBadge.className = "text-[10px] bg-green-950 text-green-400 border border-green-900 px-2 py-0.5 rounded-full font-semibold";
                
                renderBrandSelect();
                loadTechnicalDocs();
            } catch (error) {
                console.error("載入分頁清單失敗:", error);
                statusBadge.innerText = "連線失敗";
                statusBadge.className = "text-[10px] bg-red-950 text-red-400 border border-red-900 px-2 py-0.5 rounded-full font-semibold";
                document.getElementById('current-package-title').innerText = "❌ 讀取失敗，請檢查連線";
                tabsContainer.innerHTML = '<span class="text-xs text-red-400">分頁同步失敗</span>';
            }
        }

        function reloadAllData() {
            initializeDynamicSheets();
            loadTechnicalDocs();
        }

        function renderBrandSelect() {
            const brandSelect = document.getElementById('brand-select');
            const availableBrands = [...new Set(dynamicModelsData.map(item => item.brand))];

            brandSelect.innerHTML = availableBrands.map(brand => `<option value="${brand}">${brand}</option>`).join('');

            if (availableBrands.includes("PROJECT")) {
                brandSelect.value = "PROJECT";
            }

            updateModelOptions(true);
        }

        function updateModelOptions(isInitial = false) {
            const brandSelect = document.getElementById('brand-select');
            const modelSelect = document.getElementById('car-model-select');
            const currentBrand = brandSelect.value;

            const matchedModels = dynamicModelsData.filter(item => item.brand === currentBrand);

            modelSelect.innerHTML = matchedModels.map(item => `<option value="${item.sheetName}">${item.model}</option>`).join('');

            if (matchedModels.length > 0) {
                let defaultTarget = matchedModels[0].sheetName;

                if (isInitial && currentBrand === "PROJECT") {
                    const foundPrj = matchedModels.find(item => item.sheetName.includes("通用專案") || item.model.includes("通用專案"));
                    if (foundPrj) defaultTarget = foundPrj.sheetName;
                }

                modelSelect.value = defaultTarget;
                executeModelSwitch(defaultTarget);
            } else {
                clearDisplay();
            }
        }

        function executeModelSwitch(sheetName) {
            selectedModelObj = dynamicModelsData.find(item => item.sheetName === sheetName);
            if (!selectedModelObj) return;

            const brandLogo = document.getElementById('brand-logo');
            const brand = selectedModelObj.brand;

            if (brand === "CITROËN") {
                brandLogo.innerText = "CITR";
                brandLogo.className = "w-10 h-10 bg-[#1a1a1a] border border-[#da291c] rounded-full flex items-center justify-center font-black text-white text-[10px] tracking-wider shadow-md shadow-red-900/30 transition-all";
            } else if (brand === "PROJECT") {
                brandLogo.innerText = "CANN";
                brandLogo.className = "w-10 h-10 bg-[#2a1b08] border border-[#f59e0b] rounded-full flex items-center justify-center font-black text-white text-[10px] tracking-wider shadow-md shadow-amber-900/30 transition-all";
            } else if (brand === "ALFA ROMEO") {
                brandLogo.innerText = "ALFA";
                brandLogo.className = "w-10 h-10 bg-[#200508] border border-[#8b0000] rounded-full flex items-center justify-center font-black text-white text-[10px] tracking-wider shadow-md shadow-red-950 transition-all";
            } else {
                brandLogo.innerText = "PEUG";
                brandLogo.className = "w-10 h-10 bg-[#041122] border border-[#48bb78] rounded-full flex items-center justify-center font-black text-white text-[10px] tracking-wider shadow-md shadow-emerald-900/30 transition-all";
            }

            document.getElementById('package-tabs').innerHTML = '<span class="text-xs text-gray-500">正在讀取套餐資料...</span>';
            fetchSheetData();
        }

        async function fetchSheetData() {
            if (!selectedModelObj) return;

            try {
                const targetUrl = GAS_API_URL + "?action=getSheetCsv&sheet=" + encodeURIComponent(selectedModelObj.sheetName) + "&t=" + Date.now();
                const response = await fetch(targetUrl);
                const csvText = await response.text();
                parseExcelCSV(csvText);
            } catch (error) {
                console.error("抓取資料失敗:", error);
                document.getElementById('current-package-title').innerText = "❌ 雲端資料加載失敗，請檢查連線";
                clearDisplay();
            }
        }

        function parseExcelCSV(csvText) {
            const lines = csvText.split(/\r?\n/);
            const packages = {};
            let currentPackageName = ""; 

            lines.forEach((line) => {
                const cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.replace(/^"|"$/g, '').trim());
                if (cols.length < 3) return;

                const foundPackageCell = cols.find(cell => cell && (cell.includes("套餐") || cell.includes("專案")));
                
                if (foundPackageCell) {
                    currentPackageName = foundPackageCell;
                    packages[currentPackageName] = {
                        name: currentPackageName,
                        pdfUrl: "",
                        items: []
                    };
                    
                    const rawLCol = cols[11] || "";
                    if (rawLCol.startsWith("http")) {
                        packages[currentPackageName].pdfUrl = rawLCol;
                    }
                    return;
                }

                if (currentPackageName) {
                    const rawLCol = cols[11] || "";
                    if (rawLCol.startsWith("http") && !packages[currentPackageName].pdfUrl) {
                        packages[currentPackageName].pdfUrl = rawLCol;
                    }
                }

                const attr = cols[0] || "";
                const partId = cols[1] || "";
                const name = cols[2] || "";

                if (currentPackageName && partId && partId !== "料號" && attr !== "屬性") {
                    const price = cols[3] || "0";
                    const qty = cols[4] || "1";
                    const discount = cols[5] || "1";
                    const subtotal = cols[6] || "0";
                    const location = cols[7] || ""; 
                    const stock = cols[8] || ""; 
                    const description = cols[9] || ""; 

                    packages[currentPackageName].items.push({
                        attr, partId, name, price, qty, discount, subtotal, location, stock, description
                    });
                }
            });

            allParsedPackages = packages;

            const keys = Object.keys(allParsedPackages);
            if (keys.length > 0) {
                renderTabs(keys);
                switchPackage(keys[0]);
            } else {
                document.getElementById('current-package-title').innerText = "⚠️ 找不到套餐項目，請確認分頁格式";
                clearDisplay();
            }
        }

        function renderTabs(keys) {
            const tabsContainer = document.getElementById('package-tabs');
            const brand = selectedModelObj ? selectedModelObj.brand : "";
            const isCitroen = brand === "CITROËN";
            const isProject = brand === "PROJECT";
            
            let activeBgClass = "bg-emerald-600 border-emerald-500";
            if (isCitroen) activeBgClass = "bg-[#da291c] border-[#da291c]";
            if (isProject) activeBgClass = "bg-[#f59e0b] border-[#d97706]";

            tabsContainer.innerHTML = keys.map(key => `
                <button onclick="switchPackage('${key}')" id="tab-${key}" data-active-class="${activeBgClass}" class="px-2.5 py-1 rounded text-xs font-bold transition-all bg-[#161b22] text-gray-400 hover:bg-gray-800 border border-gray-800 whitespace-nowrap">
                    ${key}
                </button>
            `).join('');
        }

        function switchPackage(key) {
            if (!allParsedPackages[key]) return;

            if (currentPackageKey) {
                const prevTab = document.getElementById(`tab-${currentPackageKey}`);
                if (prevTab) prevTab.className = "px-2.5 py-1 rounded text-xs font-bold transition-all bg-[#161b22] text-gray-400 hover:bg-gray-800 border border-gray-800 whitespace-nowrap";
            }
            
            const activeTab = document.getElementById(`tab-${key}`);
            if (activeTab) {
                const targetBg = activeTab.getAttribute('data-active-class') || "bg-emerald-600 border-emerald-500";
                activeTab.className = `px-2.5 py-1 rounded text-xs font-bold transition-all text-white shadow-lg border whitespace-nowrap ${targetBg}`;
            }

            currentPackageKey = key;
            const pkg = allParsedPackages[key];

            const brand = selectedModelObj ? selectedModelObj.brand : "";
            const isCitroen = brand === "CITROËN";
            const isProject = brand === "PROJECT";
            
            let indicatorColor = "bg-[#48bb78]";
            if (isCitroen) indicatorColor = "bg-[#da291c]";
            if (isProject) indicatorColor = "bg-[#f59e0b]";

            let titleHTML = `<span class="w-2 h-4 ${indicatorColor} inline-block mr-2 rounded-sm"></span>${pkg.name}`;
            
            if (pkg.pdfUrl) {
                titleHTML += `
                    <a href="${pkg.pdfUrl}" target="_blank" rel="noopener noreferrer" class="ml-2.5 inline-flex items-center gap-1 px-2 py-0.5 text-xs font-medium text-amber-300 bg-amber-950/60 border border-amber-800/80 rounded hover:bg-amber-900/80 hover:text-white transition-all shadow-sm">
                        <span>📄</span>
                        <span>技術 PDF</span>
                    </a>
                `;
            }
            document.getElementById('current-package-title').innerHTML = titleHTML;
            
            let tableHTML = '';
            let gridHTML = '';
            
            rawLaborSum = 0;
            rawPartsSum = 0;

            pkg.items.forEach(item => {
                const isLabor = item.attr === "工資";
                const displayPrice = parseFloat(item.price) || 0;
                const displayQty = parseFloat(item.qty) || 1;
                const displayDiscount = parseFloat(item.discount) || 1;
                const lineSubtotal = Math.round(displayPrice * displayQty * displayDiscount);

                if (isLabor) {
                    rawLaborSum += lineSubtotal;
                } else {
                    rawPartsSum += lineSubtotal;
                }

                let stockBadge = '<span class="text-gray-600">-</span>';
                if (!isLabor && item.stock !== "") {
                    const num = parseFloat(item.stock);
                    if (isNaN(num) || num <= 0) {
                        stockBadge = '<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-rose-950/80 text-rose-400 border border-rose-900 animate-pulse">缺料 (0)</span>';
                    } else if (num <= 2) {
                        stockBadge = `<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-amber-950/80 text-amber-400 border border-amber-900">${num} (告急)</span>`;
                    } else {
                        stockBadge = `<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-emerald-950/80 text-emerald-400 border border-emerald-900">${num}</span>`;
                    }
                }

                let attrBadgeClass = isLabor ? "bg-slate-800 text-slate-300 border border-slate-700" : "bg-emerald-950/60 text-emerald-400 border border-emerald-900/50";
                if (!isLabor && isCitroen) attrBadgeClass = "bg-red-950/60 text-red-400 border border-red-900/50";
                if (!isLabor && isProject) attrBadgeClass = "bg-amber-950/60 text-amber-400 border border-amber-900/50";

                tableHTML += `
                    <tr id="row-${item.partId}" class="border-b border-gray-800 hover:bg-[#1f242c] transition-colors cursor-pointer text-xs" onclick="syncHighlight('${item.partId}')">
                        <td class="p-2.5">
                            <span class="px-1.5 py-0.5 rounded text-[10px] font-bold ${attrBadgeClass}">
                                ${item.attr}
                            </span>
                        </td>
                        <td class="p-2.5 font-mono text-gray-300">${item.partId}</td>
                        <td class="p-2.5 text-white font-medium">${item.name}</td>
                        <td class="p-2.5 text-right font-mono text-gray-300">${displayPrice}</td>
                        <td class="p-2.5 text-right font-mono text-gray-300">${displayQty}</td>
                        <td class="p-2.5 text-right font-mono text-gray-400">${item.discount}</td>
                        <td class="p-2.5 text-right font-mono font-bold text-green-400">${lineSubtotal}</td>
                        <td class="p-2.5 text-center font-mono text-amber-500 font-semibold">${item.location || '-'}</td>
                        <td class="p-2.5 text-center font-mono">${stockBadge}</td>
                    </tr>
                `;

                if (!isLabor && item.partId) {
                    const imgUrlPng = `${item.partId}.png`;
                    const imgUrlJpg = `${item.partId}.jpg`;
                    const defaultImg = "https://images.unsplash.com/photo-1530046339160-ce3e530c7d2f?auto=format&fit=crop&w=300&q=80";
                    const safeDesc = encodeURIComponent(item.description || "");

                    gridHTML += `
                        <div id="card-${item.partId}" class="bg-[#1f242c] border border-gray-700 rounded-lg p-2.5 flex flex-col items-center justify-between transition-all cursor-pointer hover:border-gray-500 shadow-md" onclick="syncHighlight('${item.partId}')">
                            <div class="w-full h-24 bg-[#0d1117] rounded mb-1.5 flex items-center justify-center overflow-hidden relative group" onclick="openLightbox(this.querySelector('img').src, '${item.partId}', '${item.name}', '${defaultImg}', '${safeDesc}')">
                                <img src="${imgUrlPng}" alt="${item.name}" onerror="if(this.src.endsWith('.png')){this.src='${imgUrlJpg}';}else{this.src='${defaultImg}';}" class="object-contain w-full h-full p-1 opacity-85 group-hover:opacity-100 transition-opacity">
                                <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity rounded">
                                    <span class="text-[10px] text-white ${isCitroen ? 'bg-red-600/90' : (isProject ? 'bg-amber-600/90' : 'bg-emerald-600/90')} px-1.5 py-0.5 rounded shadow">🔍 看大圖</span>
                                </div>
                            </div>
                            <div class="text-center w-full">
                                <p class="text-[10px] text-gray-500 font-mono">${item.partId}</p>
                                <p class="text-xs text-white font-medium truncate">${item.name}</p>
                            </div>
                        </div>
                    `;
                }
            });

            document.getElementById('table-rows').innerHTML = tableHTML;
            document.getElementById('image-grid').innerHTML = gridHTML;

            const styleEl = document.querySelector('style');
            let highlightColor = "#48bb78";
            if (isCitroen) highlightColor = "#da291c";
            if (isProject) highlightColor = "#f59e0b";

            styleEl.innerHTML = `
                body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
                .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
                .custom-scrollbar::-webkit-scrollbar-track { background: #161b22; }
                .custom-scrollbar::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
                .active-row { background-color: #1f242c !important; border-left: 4px solid ${highlightColor} !important; }
                .active-card { border-color: ${highlightColor} !important; background-color: #21262d !important; transform: scale(1.02); }
                .active-doc { border-color: #dc2626 !important; background-color: #1c1917 !important; border-left: 4px solid #ef4444 !important; }
            `;

            calculateTotalsWithDiscount();
        }

        function calculateTotalsWithDiscount() {
            const discountInput = document.getElementById('part-discount-input');
            let discountRate = parseFloat(discountInput.value);

            if (isNaN(discountRate) || discountRate < 0) discountRate = 100;

            const discountedPartsSum = Math.round(rawPartsSum * (discountRate / 100));
            const grandTotal = rawLaborSum + discountedPartsSum;

            document.getElementById('labor-subtotal').innerText = `$ ${rawLaborSum.toLocaleString()}`;
            document.getElementById('parts-original-total').innerText = `$ ${rawPartsSum.toLocaleString()}`;
            document.getElementById('parts-subtotal').innerText = `$ ${discountedPartsSum.toLocaleString()}`;
            document.getElementById('package-total').innerText = `$ ${grandTotal.toLocaleString()}`;

            const discountNote = document.getElementById('discount-note');
            if (discountRate < 100) {
                discountNote.innerText = `＊已套用 ${discountRate}% 零件折扣`;
                discountNote.classList.remove('hidden');
            } else {
                discountNote.classList.add('hidden');
            }
        }

        function syncHighlight(partId) {
            document.querySelectorAll('tr').forEach(el => el.classList.remove('active-row'));
            document.querySelectorAll('#image-grid > div').forEach(el => el.classList.remove('active-card'));

            const row = document.getElementById(`row-${partId}`);
            const card = document.getElementById(`card-${partId}`);
            if (row) row.classList.add('active-row');
            if (card) card.classList.add('active-card');
        }

        function openLightbox(imgSrc, partId, title, defaultImg, encodedDesc) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            const lightboxPartId = document.getElementById('lightbox-part-id');
            const lightboxTitle = document.getElementById('lightbox-title');
            
            const description = decodeURIComponent(encodedDesc).trim();
            const descContainer = document.getElementById('lightbox-desc-container');
            const descText = document.getElementById('lightbox-desc-text');

            lightboxImg.src = imgSrc;
            lightboxImg.onerror = function() { this.src = defaultImg; };

            lightboxPartId.innerText = partId;
            lightboxTitle.innerText = title;

            if (description) {
                descText.innerText = description;
                descContainer.classList.remove('hidden');
            } else {
                descContainer.classList.add('hidden');
            }

            lightbox.classList.remove('hidden');
            setTimeout(() => { lightbox.classList.remove('opacity-0'); }, 10);
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.add('opacity-0');
            setTimeout(() => { lightbox.classList.add('hidden'); }, 300);
        }

        function clearDisplay() {
            document.getElementById('table-rows').innerHTML = '';
            document.getElementById('image-grid').innerHTML = '';
            document.getElementById('package-total').innerText = '$ 0';
        }

        /* -------------------------------------------------------------
           技術文獻系統模組
        ------------------------------------------------------------- */
        function switchMainMode(mode) {
            const packageView = document.getElementById('package-view');
            const docsView = document.getElementById('docs-view');
            const btnPackage = document.getElementById('btn-mode-package');
            const btnDocs = document.getElementById('btn-mode-docs');
            const pkgTabs = document.getElementById('package-tabs');

            if (mode === 'docs') {
                packageView.classList.add('hidden');
                docsView.classList.remove('hidden');
                btnPackage.className = "px-3 py-1 rounded text-xs font-bold transition-all text-gray-400 hover:text-white";
                btnDocs.className = "px-3 py-1 rounded text-xs font-bold transition-all bg-[#da291c] text-white shadow";
                pkgTabs.classList.add('invisible');
                filterDocs();
            } else {
                docsView.classList.add('hidden');
                packageView.classList.remove('hidden');
                btnDocs.className = "px-3 py-1 rounded text-xs font-bold transition-all text-gray-400 hover:text-white";
                btnPackage.className = "px-3 py-1 rounded text-xs font-bold transition-all bg-[#0d1117] text-white shadow";
                pkgTabs.classList.remove('invisible');
            }
        }

        async function loadTechnicalDocs() {
            try {
                const res = await fetch(GAS_API_URL + "?action=getDocs&t=" + Date.now());
                if (!res.ok) return;
                rawDocsData = await res.json();
                renderDocTags();
                filterDocs();
            } catch (err) {
                console.error("技術文獻載入異常:", err);
            }
        }

        function renderDocTags() {
            const container = document.getElementById('doc-tags-container');
            const allTags = new Set();

            rawDocsData.forEach(doc => {
                if (doc.category) {
                    // 同時支援空白鍵、斜線、逗號切割標籤
                    doc.category.split(/[\/, ]/).forEach(t => {
                        const trimmed = t.trim();
                        if (trimmed) allTags.add(trimmed);
                    });
                }
            });

            let tagsHTML = `
                <button onclick="setDocTag('ALL')" id="tag-btn-ALL" class="px-2.5 py-1 rounded text-[11px] font-bold transition-all bg-red-600 text-white shadow">
                    全部 (${rawDocsData.length})
                </button>
            `;

            allTags.forEach(tag => {
                const count = rawDocsData.filter(d => d.category && d.category.includes(tag)).length;
                tagsHTML += `
                    <button onclick="setDocTag('${tag}')" id="tag-btn-${tag}" class="px-2 py-1 rounded text-[11px] font-bold transition-all bg-[#0d1117] text-gray-400 hover:bg-gray-800 border border-gray-800">
                        ${tag} (${count})
                    </button>
                `;
            });

            container.innerHTML = tagsHTML;
        }

        function setDocTag(tag) {
            activeDocTag = tag;
            document.querySelectorAll('#doc-tags-container button').forEach(btn => {
                btn.className = "px-2 py-1 rounded text-[11px] font-bold transition-all bg-[#0d1117] text-gray-400 hover:bg-gray-800 border border-gray-800";
            });
            const activeBtn = document.getElementById(`tag-btn-${tag}`);
            if (activeBtn) {
                activeBtn.className = "px-2.5 py-1 rounded text-[11px] font-bold transition-all bg-red-600 text-white shadow";
            }
            filterDocs();
        }

        function filterDocs() {
            const searchKeyword = document.getElementById('doc-search-input').value.trim().toLowerCase();

            const filtered = rawDocsData.filter(doc => {
                const matchTag = (activeDocTag === "ALL") || (doc.category && doc.category.includes(activeDocTag));
                const matchSearch = !searchKeyword || 
                    (doc.title && doc.title.toLowerCase().includes(searchKeyword)) ||
                    (doc.category && doc.category.toLowerCase().includes(searchKeyword)) ||
                    (doc.keyword && doc.keyword.toLowerCase().includes(searchKeyword)) ||
                    (doc.date && doc.date.toLowerCase().includes(searchKeyword));

                return matchTag && matchSearch;
            });

            renderDocsList(filtered);
        }

        function renderDocsList(docs) {
            const listContainer = document.getElementById('docs-list-container');
            const countBadge = document.getElementById('docs-count-badge');
            countBadge.innerText = `${docs.length} 份文件`;

            if (docs.length === 0) {
                listContainer.innerHTML = '<div class="text-center py-8 text-gray-500 text-xs">查無符合條件的技術文獻</div>';
                return;
            }

            listContainer.innerHTML = docs.map((doc, index) => {
                return `
                    <div id="doc-card-${index}" onclick="previewDoc('${doc.url}', ${index})" class="bg-[#0d1117] border border-gray-800 hover:border-gray-600 rounded-lg p-3 cursor-pointer transition-all flex flex-col justify-between space-y-1.5 shadow-md group">
                        <div class="flex items-center justify-between">
                            <span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-red-950/80 text-red-400 border border-red-900">
                                ${doc.category || '未分類'}
                            </span>
                            <span class="text-[10px] text-gray-500 font-mono">${doc.date}</span>
                        </div>
                        <h4 class="text-xs font-semibold text-white leading-snug line-clamp-2 group-hover:text-amber-400 transition-colors">${doc.title}</h4>
                        <div class="flex justify-end pt-1">
                            <span class="text-[10px] text-gray-400 group-hover:text-red-400 flex items-center">
                                預覽 <span class="ml-1 text-[8px]">▶</span>
                            </span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function previewDoc(url, index) {
            if (!url) return;

            document.querySelectorAll('#docs-list-container > div').forEach(el => el.classList.remove('active-doc'));
            const activeCard = document.getElementById(`doc-card-${index}`);
            if (activeCard) activeCard.classList.add('active-doc');

            const placeholder = document.getElementById('pdf-placeholder');
            const iframe = document.getElementById('pdf-iframe');

            let embedUrl = url;
            if (url.includes('drive.google.com') && url.includes('/view')) {
                embedUrl = url.replace('/view', '/preview');
            }

            placeholder.classList.add('hidden');
            iframe.classList.remove('hidden');
            iframe.src = embedUrl;
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') closeLightbox();
        });

        // 啟動流程
        initializeDynamicSheets();
    </script>
</body>
</html>
