<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>工時打卡記錄編輯與列印</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            background: #eef2f5;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        /* 控制面板樣式 */
        .controls {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .controls h2 { margin-top: 0; font-size: 1.2rem; border-bottom: 2px solid #2b5797; padding-bottom: 8px; }
        
        .sync-bar {
            background: #f0f4f8;
            border: 1px solid #d0dbe5;
            border-radius: 4px;
            padding: 8px 12px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
        }
        .sync-bar input {
            flex: 1;
            padding: 6px 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }
        .form-group { display: flex; flex-direction: column; position: relative; }
        .form-group label { font-size: 0.8rem; font-weight: bold; margin-bottom: 4px; color: #555; }
        .form-group input { padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; }
        
        input::placeholder {
            color: #aaa;
            font-size: 0.82rem;
            font-style: italic;
        }

        .highlight-input {
            border: 1.5px solid #2b5797 !important;
            background: #fbfdff;
        }

        .table-input {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }
        .table-input th, .table-input td {
            border: 1px solid #ddd;
            padding: 6px;
            text-align: left;
            font-size: 0.85rem;
        }
        .table-input th { background: #f8f9fa; }
        .table-input input, .table-input select { 
            width: 100%; 
            border: 1px solid #ddd; 
            padding: 4px; 
            font-size: 0.85rem; 
            border-radius: 3px;
        }
        
        .btn-group { 
            display: flex; 
            gap: 10px; 
            flex-wrap: wrap;
            align-items: center;
        }
        button, .file-label-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-add { background: #4caf50; color: #fff; }
        .btn-del { background: #f44336; color: #fff; padding: 4px 8px; font-size: 0.8rem; }
        .btn-clear { background: #e53935; color: #fff; }
        .btn-export { background: #ff9800; color: #fff; }
        .btn-import { background: #607d8b; color: #fff; }
        .btn-sync { background: #0288d1; color: #fff; padding: 6px 12px; }
        .btn-print { background: #2b5797; color: #fff; font-size: 1rem; margin-left: auto; }

        /* 列印預覽區域：固定以標準列印紙張比例進行渲染 */
        .print-preview {
            background: #ffffff;
            padding: 30px 40px;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            font-family: "Courier New", "Consolas", "Microsoft JhengHei", monospace;
            color: #000;
        }
        .doc-title {
            text-align: center;
            font-size: 1.25rem;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }
        .meta-grid {
            display: grid;
            grid-template-columns: 1.2fr 1.5fr 1.1fr;
            gap: 10px;
            font-size: 0.85rem;
            line-height: 1.45;
        }
        .meta-col { display: flex; flex-direction: column; }
        .separator {
            border: none;
            border-top: 1px dashed #000;
            margin: 10px 0 4px 0;
        }

        /* 核心表格排版：拿掉所有造成「...」與擠壓變形的樣式 */
        .report-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
        }
        .report-table th, .report-table td {
            padding: 4px 3px;
            text-align: left;
            vertical-align: middle;
            white-space: nowrap; /* 嚴禁任何字元折行 */
        }
        .report-table th {
            font-weight: bold;
        }
        .report-table thead tr th {
            border-top: 1px dashed #000;
            border-bottom: 1px dashed #000;
            padding-top: 6px;
            padding-bottom: 6px;
        }
        .text-right { text-align: right !important; }
        .text-center { text-align: center !important; }

        @media print {
            body { 
                background: #fff; 
                padding: 0;
                margin: 0;
            }
            .controls { display: none !important; }
            .print-preview { 
                box-shadow: none; 
                padding: 10mm 10mm; 
                margin: 0 auto; 
                width: 100%;
            }
            .report-table th, .report-table td {
                font-size: 0.82rem;
                padding: 4px 2px;
            }
            @page { 
                size: A4 portrait;
                margin: 5mm; 
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <h2>工時資料編輯面板</h2>
        
        <div class="sync-bar">
            <span style="font-weight: bold; color: #0288d1;">📊 車籍工單 CSV 網址:</span>
            <input type="text" id="sheetUrl" value="https://docs.google.com/spreadsheets/d/e/2PACX-1vRTY8U3Py3Rb5dH3v6RJDi-3Un7mEBM5t06oxtqdwXbgfJa0sJ3axhwyumrKqSSRu5gz4aRyNHmhF33/pub?gid=1615272433&single=true&output=csv">
            <button class="btn-sync" onclick="syncGoogleSheet()">🔄 重新整理雲端資料</button>
            <span id="syncStatus" style="color: #666; font-size: 0.8rem;">(初始化連線中...)</span>
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label style="color: #2b5797;">🔍 車牌 (打前綴自動推薦)</label>
                <input type="text" id="carPlate" list="carPlateList" class="highlight-input" placeholder="例: RFT-9760" oninput="onCarPlateInput()">
                <datalist id="carPlateList"></datalist>
            </div>

            <div class="form-group"><label>單號編號 (工單號)</label><input type="text" id="docNo" placeholder="例: B260900261" oninput="render()"></div>
            <div class="form-group"><label>服務廠</label><input type="text" id="servicePlant" value="尚鵬汽車-內湖保養廠" placeholder="例: 尚鵬汽車-內湖保養廠" oninput="render()"></div>
            <div class="form-group"><label>工單類別</label><input type="text" id="workType" placeholder="例: 索賠 / 引電 / 定保" oninput="render()"></div>
            <div class="form-group"><label>進廠里程</label><input type="text" id="mileage" placeholder="例: 4129" oninput="render()"></div>
            <div class="form-group"><label>開單時間</label><input type="text" id="openTime" placeholder="例: 2026-09-10 10:36" oninput="render()"></div>
            <div class="form-group"><label>完工日期</label><input type="text" id="finishTime" placeholder="例: 2026-09-10 12:00" oninput="render()"></div>
            <div class="form-group"><label>保固到期</label><input type="text" id="warrantyDate" placeholder="例: 2029-09-10" oninput="render()"></div>
            
            <div class="form-group"><label>車型</label><input type="text" id="carModel" placeholder="例: 3008 HYBRID / GIULIA" oninput="render()"></div>
            <div class="form-group"><label>年式</label><input type="text" id="carYear" value="2026" placeholder="例: 2026" oninput="render()"></div>
            <div class="form-group"><label>VIN碼 (車身號碼)</label><input type="text" id="vin" placeholder="例: VR3KAHPY1SS052436" oninput="render()"></div>
            <div class="form-group"><label>引擎碼</label><input type="text" id="engineNo" placeholder="例: 10XR020008228" oninput="render()"></div>
            <div class="form-group"><label>車身#</label><input type="text" id="bodyNo" placeholder="例: VR3KAHPY1SS..." oninput="render()"></div>
            <div class="form-group"><label>車主</label><input type="text" id="owner" placeholder="例: 王修芬 / 租賃公司" oninput="render()"></div>
            <div class="form-group"><label>駕駛</label><input type="text" id="driver" placeholder="例: 王大明" oninput="render()"></div>
            <div class="form-group"><label>承修技師</label><input type="text" id="mechanic" placeholder="例: 謝或翰" oninput="onMechanicChange()"></div>
            <div class="form-group"><label>服務專員</label><input type="text" id="advisor" placeholder="例: 徐漢威 / 周永盛" oninput="render()"></div>
            <div class="form-group"><label>列印時間</label><input type="text" id="printTime" placeholder="例: 2026-09-10 11:30:00" oninput="render()"></div>
            <div class="form-group"><label>頁次</label><input type="text" id="pageIndex" value="1 / 1" placeholder="例: 1 / 1" oninput="render()"></div>
        </div>

        <table class="table-input" id="itemsTable">
            <thead>
                <tr>
                    <th style="width: 105px;">打卡日期</th>
                    <th style="width: 75px;">起始</th>
                    <th style="width: 75px;">結束 (+5%)</th>
                    <th style="width: 80px;">打卡原因</th>
                    <th style="width: 105px;">工作代號</th>
                    <th>工作項目</th>
                    <th style="width: 75px;">標準工時</th>
                    <th style="width: 80px;">技師</th>
                    <th style="width: 50px;">操作</th>
                </tr>
            </thead>
            <tbody id="itemsBody"></tbody>
        </table>

        <div class="btn-group">
            <button class="btn-add" onclick="addRow()">+ 新增工作行</button>
            <button class="btn-clear" onclick="clearAllData()">🧹 一鍵清空</button>
            <button class="btn-export" onclick="exportData()">💾 匯出存檔 (JSON)</button>
            <label class="file-label-btn btn-import">
                📂 匯入檔案
                <input type="file" id="importFileInput" accept=".json" style="display: none;" onchange="importData(event)">
            </label>
            <button class="btn-print" onclick="window.print()">🖨️ 列印打卡單</button>
        </div>
    </div>

    <!-- 列印預覽區域 -->
    <div class="print-preview">
        <div class="doc-title" id="outDocTitle">打卡記錄 - </div>
        
        <div class="meta-grid">
            <div class="meta-col">
                <div>服務廠: <span id="outServicePlant"></span></div>
                <div>工單類別: <span id="outWorkType"></span></div>
                <div>進廠里程: <span id="outMileage"></span></div>
                <div>開單時間: <span id="outOpenTime"></span></div>
                <div>完工日期: <span id="outFinishTime"></span></div>
                <div>保固到期: <span id="outWarrantyDate"></span></div>
            </div>
            <div class="meta-col">
                <div>車牌: <span id="outCarPlate"></span></div>
                <div>車型: <span id="outCarModel"></span></div>
                <div>年式: <span id="outCarYear"></span></div>
                <div>VIN#: <span id="outVin"></span></div>
                <div>引擎#: <span id="outEngineNo"></span></div>
                <div>車身#: <span id="outBodyNo"></span></div>
            </div>
            <div class="meta-col">
                <div>車主: <span id="outOwner"></span></div>
                <div>駕駛: <span id="outDriver"></span></div>
                <div>承修技師: <span id="outMechanic"></span></div>
                <div>服務專員: <span id="outAdvisor"></span></div>
                <div>列印時間: <span id="outPrintTime"></span></div>
                <div>頁次: <span id="outPageIndex"></span></div>
            </div>
        </div>

        <hr class="separator">

        <!-- 寬度比例配置：保證文字自然伸展，完全與預覽吻合 -->
        <table class="report-table" id="outItemsTable">
            <thead>
                <tr>
                    <th style="width: 4%;">序</th>
                    <th style="width: 13%;">打卡日期</th>
                    <th style="width: 7%;">起始時間</th>
                    <th style="width: 7%;">結束時間</th>
                    <th style="width: 8%;">打卡原因</th>
                    <th style="width: 12%;">工作代號</th>
                    <th>工作項目</th>
                    <th class="text-right" style="width: 8%;">標準工時</th>
                    <th class="text-center" style="width: 8%;">技師</th>
                    <th class="text-right" style="width: 7%;">打卡工時</th>
                    <th class="text-right" style="width: 7%;">累計工時</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
    const formFields = [
        'docNo', 'servicePlant', 'workType', 'mileage', 'openTime', 
        'finishTime', 'warrantyDate', 'carPlate', 'carModel', 'carYear', 
        'vin', 'engineNo', 'bodyNo', 'owner', 'driver', 'mechanic', 
        'advisor', 'printTime', 'pageIndex'
    ];

    let vehicleDatabase = [];
    
    let records = [
        { date: '', start: '', end: '', reason: '開工', code: '', name: '', stdHours: '', tech: '' }
    ];

    function getCurrentDateTime() {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        const hh = String(now.getHours()).padStart(2, '0');
        const mm = String(now.getMinutes()).padStart(2, '0');
        const ss = String(now.getSeconds()).padStart(2, '0');
        return `${y}-${m}-${d} ${hh}:${mm}:${ss}`;
    }

    function parseCSVLine(text) {
        let p = '', c = '', r = [];
        let q = false;
        for (let i = 0; i < text.length; i++) {
            c = text[i];
            if (c === '"') {
                if (q && text[i+1] === '"') { p += '"'; i++; }
                else { q = !q; }
            } else if (c === ',' && !q) {
                r.push(p.trim());
                p = '';
            } else {
                p += c;
            }
        }
        r.push(p.trim());
        return r;
    }

    function refreshDataList() {
        const datalist = document.getElementById('carPlateList');
        datalist.innerHTML = '';
        
        vehicleDatabase.forEach(v => {
            if (!v.plate) return;
            const opt = document.createElement('option');
            opt.value = v.plate;
            opt.label = `[${v.docNo}] ${v.model} - ${v.owner}`;
            datalist.appendChild(opt);
        });
    }

    function onCarPlateInput() {
        const inputVal = document.getElementById('carPlate').value.trim().toUpperCase();
        const match = vehicleDatabase.find(v => v.plate.toUpperCase() === inputVal);
        
        if (match) {
            document.getElementById('docNo').value = match.docNo || '';
            document.getElementById('workType').value = match.workType || '';
            document.getElementById('mileage').value = match.mileage || '';
            document.getElementById('openTime').value = match.openTime || '';
            document.getElementById('finishTime').value = match.finishTime || '';
            document.getElementById('carModel').value = match.model || '';
            document.getElementById('vin').value = match.vin || '';
            document.getElementById('engineNo').value = match.engineNo || '';
            document.getElementById('bodyNo').value = match.bodyNo || '';
            document.getElementById('owner').value = match.owner || '';
            document.getElementById('driver').value = match.owner || '';
            document.getElementById('advisor').value = match.advisor || '';
            if (match.plant) document.getElementById('servicePlant').value = '尚鵬汽車-' + match.plant;
            
            if (!document.getElementById('printTime').value) {
                document.getElementById('printTime').value = getCurrentDateTime();
            }
        }
        render();
    }

    async function syncGoogleSheet() {
        const url = document.getElementById('sheetUrl').value.trim();
        if (!url) return;

        try {
            document.getElementById('syncStatus').innerText = '正在自雲端抓取 113BM01 工單清冊...';
            const res = await fetch(url);
            const text = await res.text();
            
            const lines = text.split(/\r?\n/).filter(r => r.trim() !== '');
            if (lines.length <= 1) {
                document.getElementById('syncStatus').innerText = '⚠️ 試算表無資料';
                return;
            }

            const headerCols = parseCSVLine(lines[0]);
            const getCol = (name, fallback) => {
                const idx = headerCols.indexOf(name);
                return idx !== -1 ? idx : fallback;
            };

            const colMap = {
                plant: getCol('部門', 1),
                openTime: getCol('開單時間', 2),
                docNo: getCol('工單號碼', 3),
                workType: getCol('工單類別', 4),
                plate: getCol('牌照號碼', 5),
                owner: getCol('車主', 6),
                model: getCol('車型', 7),
                mileage: getCol('里程', 8),
                advisor: getCol('服務專員', 11),
                finishTime: getCol('完工日期', 15),
                engineNo: getCol('引擎#', 17),
                bodyNo: getCol('車身#', 18),
                vin: getCol('VIN#', 19)
            };

            const newDb = [];
            for (let i = 1; i < lines.length; i++) {
                const cols = parseCSVLine(lines[i]);
                const plate = cols[colMap.plate];
                if (plate && plate !== '牌照號碼') {
                    newDb.push({
                        plate: plate,
                        plant: cols[colMap.plant] || '內湖保養廠',
                        openTime: cols[colMap.openTime] || '',
                        docNo: cols[colMap.docNo] || '',
                        workType: cols[colMap.workType] || '',
                        owner: cols[colMap.owner] || '',
                        model: cols[colMap.model] || '',
                        mileage: cols[colMap.mileage] || '',
                        advisor: cols[colMap.advisor] || '',
                        finishTime: cols[colMap.finishTime] || '',
                        engineNo: cols[colMap.engineNo] || '',
                        bodyNo: cols[colMap.bodyNo] || '',
                        vin: cols[colMap.vin] || ''
                    });
                }
            }

            if (newDb.length > 0) {
                vehicleDatabase = newDb;
                refreshDataList();
                document.getElementById('syncStatus').innerText = `✅ 雲端連線成功！已載入 ${vehicleDatabase.length} 筆在廠工單車籍。`;
                localStorage.setItem('cached113BM01Db', JSON.stringify(vehicleDatabase));
            } else {
                document.getElementById('syncStatus').innerText = `⚠️ 未抓取到有效車籍列`;
            }
        } catch (err) {
            console.error(err);
            document.getElementById('syncStatus').innerText = '❌ 連線逾時或讀取失敗';
        }
    }

    function calculateHours(start, end) {
        if (!start || !end) return 0;
        const [h1, m1] = start.split(':').map(Number);
        const [h2, m2] = end.split(':').map(Number);
        if (isNaN(h1) || isNaN(m1) || isNaN(h2) || isNaN(m2)) return 0;
        let diffMinutes = (h2 * 60 + m2) - (h1 * 60 + m1);
        if (diffMinutes < 0) diffMinutes += 24 * 60;
        return diffMinutes / 60;
    }

    // 格式化工時：精確輸出為小數點後 2 位，絕不產生多餘位數或省略號
    function formatHours(val) {
        if (val === '' || val === null || val === undefined) return '';
        const num = parseFloat(val);
        if (isNaN(num)) return val;
        // 固定保留小數兩位，如 0.11 或 0.50 -> 0.5
        return (Math.round(num * 100) / 100).toString();
    }

    // 依起始時間與工時自動推算結束時間（控制在超過 5%，不超過 20%）
    function autoCalcEndTime(startTime, stdHoursStr) {
        if (!startTime || !stdHoursStr) return '';
        const parts = startTime.split(':').map(Number);
        if (parts.length < 2 || isNaN(parts[0]) || isNaN(parts[1])) return '';

        const hours = parseFloat(stdHoursStr);
        if (isNaN(hours) || hours <= 0) return '';

        // 計算工作時數轉分鐘：精準增加 5%（取整數），確保完全壓在 5%~10% 安全範圍內
        const baseMinutes = hours * 60;
        let addMinutes = Math.round(baseMinutes * 0.05);
        if (addMinutes < 1) addMinutes = 1; // 至少多 1 分鐘

        const totalAddMinutes = Math.round(baseMinutes) + addMinutes;

        let totalMinutes = (parts[0] * 60 + parts[1]) + totalAddMinutes;
        totalMinutes = totalMinutes % (24 * 60);

        const endH = Math.floor(totalMinutes / 60);
        const endM = totalMinutes % 60;

        return `${String(endH).padStart(2, '0')}:${String(endM).padStart(2, '0')}`;
    }

    function onMechanicChange() {
        const defaultTech = document.getElementById('mechanic').value || '';
        records.forEach(r => {
            if (!r.tech) r.tech = defaultTech;
        });
        renderInputs();
        render();
    }

    function addRow() {
        const defaultTech = document.getElementById('mechanic').value || '';
        const lastRow = records[records.length - 1];
        const lastDate = lastRow ? lastRow.date : '';

        records.push({
            date: lastDate,
            start: '',
            end: '',
            reason: '開工',
            code: '',
            name: '',
            stdHours: '',
            tech: defaultTech
        });

        renderInputs();
        render();
    }

    function deleteRow(idx) {
        records.splice(idx, 1);
        renderInputs();
        render();
    }

    function updateField(idx, field, val) {
        records[idx][field] = val;

        // 當輸入起始時間或標準工時，自動換算本行的結束時間 (+5%)
        if (field === 'start' || field === 'stdHours') {
            const calculatedEnd = autoCalcEndTime(records[idx].start, records[idx].stdHours);
            if (calculatedEnd) {
                records[idx].end = calculatedEnd;
                const rowTr = document.getElementById(`row-${idx}`);
                if (rowTr) {
                    const endInput = rowTr.querySelector('[data-field="end"]');
                    if (endInput) endInput.value = calculatedEnd;
                }
            }
        }
        render();
    }

    function clearAllData() {
        if (!confirm('確定要清空所有填寫內容嗎？（服務廠名稱將會保留）')) return;

        formFields.forEach(id => {
            if (id === 'servicePlant') {
                document.getElementById(id).value = '尚鵬汽車-內湖保養廠';
            } else if (id === 'pageIndex') {
                document.getElementById(id).value = '1 / 1';
            } else if (id === 'carYear') {
                document.getElementById(id).value = '2026';
            } else {
                document.getElementById(id).value = '';
            }
        });

        records = [
            { date: '', start: '', end: '', reason: '開工', code: '', name: '', stdHours: '', tech: '' }
        ];
        renderInputs();
        render();
    }

    function renderInputs() {
        const tbody = document.getElementById('itemsBody');
        tbody.innerHTML = '';

        records.forEach((row, i) => {
            const tr = document.createElement('tr');
            tr.id = `row-${i}`;

            tr.innerHTML = `
                <td>
                    <input type="text" data-field="date" value="${row.date || ''}" placeholder="26-07-28" 
                           oninput="updateField(${i}, 'date', this.value)">
                </td>
                <td>
                    <input type="text" data-field="start" value="${row.start || ''}" placeholder="10:00" 
                           oninput="updateField(${i}, 'start', this.value)">
                </td>
                <td>
                    <input type="text" data-field="end" value="${row.end || ''}" placeholder="自動推算" 
                           oninput="updateField(${i}, 'end', this.value)">
                </td>
                <td>
                    <select onchange="updateField(${i}, 'reason', this.value)">
                        <option value="開工" ${row.reason === '開工' ? 'selected' : ''}>開工</option>
                        <option value="完工" ${row.reason === '完工' ? 'selected' : ''}>完工</option>
                        <option value="中斷" ${row.reason === '中斷' ? 'selected' : ''}>中斷</option>
                        <option value="復工" ${row.reason === '復工' ? 'selected' : ''}>復工</option>
                    </select>
                </td>
                <td>
                    <input type="text" data-field="code" value="${row.code || ''}" placeholder="1820099J" 
                           oninput="updateField(${i}, 'code', this.value)">
                </td>
                <td>
                    <input type="text" data-field="name" value="${row.name || ''}" placeholder="預防性操作:檢查及更新" 
                           oninput="updateField(${i}, 'name', this.value)">
                </td>
                <td>
                    <input type="text" data-field="stdHours" value="${row.stdHours || ''}" placeholder="0.67" 
                           oninput="updateField(${i}, 'stdHours', this.value)">
                </td>
                <td>
                    <input type="text" data-field="tech" value="${row.tech || ''}" placeholder="謝或翰" 
                           oninput="updateField(${i}, 'tech', this.value)">
                </td>
                <td style="text-align: center;">
                    <button class="btn-del" onclick="deleteRow(${i})">刪除</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function render() {
        document.getElementById('outDocTitle').innerText = '打卡記錄 - ' + document.getElementById('docNo').value;
        document.getElementById('outServicePlant').innerText = document.getElementById('servicePlant').value;
        document.getElementById('outWorkType').innerText = document.getElementById('workType').value;
        document.getElementById('outMileage').innerText = document.getElementById('mileage').value;
        document.getElementById('outOpenTime').innerText = document.getElementById('openTime').value;
        document.getElementById('outFinishTime').innerText = document.getElementById('finishTime').value;
        document.getElementById('outWarrantyDate').innerText = document.getElementById('warrantyDate').value;
        
        document.getElementById('outCarPlate').innerText = document.getElementById('carPlate').value;
        document.getElementById('outCarModel').innerText = document.getElementById('carModel').value;
        document.getElementById('outCarYear').innerText = document.getElementById('carYear').value;
        document.getElementById('outVin').innerText = document.getElementById('vin').value;
        document.getElementById('outEngineNo').innerText = document.getElementById('engineNo').value;
        document.getElementById('outBodyNo').innerText = document.getElementById('bodyNo').value;

        document.getElementById('outOwner').innerText = document.getElementById('owner').value;
        document.getElementById('driver').placeholder = document.getElementById('owner').value;
        document.getElementById('outDriver').innerText = document.getElementById('driver').value || document.getElementById('owner').value;
        document.getElementById('outMechanic').innerText = document.getElementById('mechanic').value;
        document.getElementById('outAdvisor').innerText = document.getElementById('advisor').value;
        document.getElementById('outPrintTime').innerText = document.getElementById('printTime').value;
        document.getElementById('outPageIndex').innerText = document.getElementById('pageIndex').value;

        const outTbody = document.querySelector('#outItemsTable tbody');
        outTbody.innerHTML = '';
        let cumulative = 0;

        for (let i = 0; i < records.length; i++) {
            const row = records[i];
            const hasTime = row.start && row.end;
            const workHours = hasTime ? calculateHours(row.start, row.end) : 0;
            if (hasTime) cumulative += workHours;

            // 標準工時照原本輸入字串呈現；打卡工時直接乾淨格式化到兩位小數
            const stdVal = row.stdHours ? row.stdHours : '';
            const workVal = hasTime ? formatHours(workHours) : '';
            const cumVal = hasTime ? formatHours(cumulative) : '';

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="width: 4%;">${i + 1}</td>
                <td style="width: 13%;">${row.date || ''}</td>
                <td style="width: 7%;">${row.start || ''}</td>
                <td style="width: 7%;">${row.end || ''}</td>
                <td style="width: 8%;">${row.reason || ''}</td>
                <td style="width: 12%;">${row.code || ''}</td>
                <td>${row.name || ''}</td>
                <td class="text-right" style="width: 8%;">${stdVal}</td>
                <td class="text-center" style="width: 8%;">${row.tech || ''}</td>
                <td class="text-right" style="width: 7%;">${workVal}</td>
                <td class="text-right" style="width: 7%;">${cumVal}</td>
            `;
            outTbody.appendChild(tr);
        }
    }

    function exportData() {
        const data = { fields: {}, records: records };
        formFields.forEach(id => { data.fields[id] = document.getElementById(id).value; });
        const jsonStr = JSON.stringify(data, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const filename = `${data.fields.docNo || '工時記錄'}_${data.fields.carPlate || ''}.json`;
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (data.fields) {
                    formFields.forEach(id => {
                        if (data.fields[id] !== undefined) document.getElementById(id).value = data.fields[id];
                    });
                }
                if (Array.isArray(data.records)) records = data.records;
                renderInputs();
                render();
                alert('資料匯入成功！');
            } catch (err) {
                alert('檔案格式錯誤，無法解析 JSON！');
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    window.onload = function() {
        document.getElementById('printTime').value = getCurrentDateTime();

        const cachedDb = localStorage.getItem('cached113BM01Db');
        if (cachedDb) {
            try {
                vehicleDatabase = JSON.parse(cachedDb);
                refreshDataList();
                document.getElementById('syncStatus').innerText = `(已載入快取 ${vehicleDatabase.length} 筆，正在檢查雲端更新...)`;
            } catch(e) {}
        }
        
        syncGoogleSheet();
        renderInputs();
        render();
    };
</script>

</body>
</html>
